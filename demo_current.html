/* ============ R2→R3 过渡（2026-09-06 用户定案，替代 FxSnow）============
   文本栏消失（button_end 已收，closeTextbox 双保险）→ tint 淡出（1.2s）
   → R3 画布淡入叠化（1.2s，frame 平移缩放到 R3 椭圆位置 = 画布自身呈现）
   无头环境（sim）安全跳过（无 DOM 效果，直接进终态）。 */
function R2toR3Transition(){
  try {
    closeTextbox();                       // ① 文本栏消失
    TintSys.clear(1200);                  // ② tint 淡出
    if (typeof R3Canvas !== 'undefined') R3Canvas.enter();   // ③④ 背景+frame（画布淡入）
  } catch (e) {}
}

/* ============ 文本渲染 ============ */
/* 讲话者头像：[01]/[02] 各自对应一张立绘；[03] 不显示头像框（2026-08-30 定案，签音照常） */
const AVATAR = {
  '01': 'art/avatar/character_01.png',
  '02': 'art/avatar/character_02.png'
};
function setAvatar(sp) {
  if (AVATAR[sp]) {
    el.avatar.style.backgroundImage = `url("${AVATAR[sp]}")`;
    el.avatar.style.display = 'block';
  } else {
    el.avatar.style.display = 'none';
  }
  AudioSys.speakerOn(sp);   // 签音与头像同源：换人才触发；[00]/'pl' 无声
}

function appendLine(sp, txt) {
  const div = document.createElement('div');
  div.className = 'line';
  let prefix = '';
  if (SPEAKER[sp]) prefix = `<span class="sp ${SP_CLASS[sp]}">${SPEAKER[sp]}</span>`;
  div.innerHTML = prefix + fmt(txt);
  el.lines.appendChild(div);

  const all = el.lines.querySelectorAll('.line');
  all.forEach(d => d.classList.remove('latest'));
  div.classList.add('latest');

  setAvatar(sp);
  AudioSys.duckMusic();               // 台词进场：音乐俯身让位

  state.shownLineCount++;
  state.followBottom = true;
  layout();
}

/* 文本格式化：**粗体**（marked 语法） */
function fmt(txt) {
  return txt.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

/* 情感标签行：{tag:} 生效时插入。格式"[情感：哀/思]"，列出该物象全部可能路径；
 * 字色 = 当前情感色（EMO_COLOR 定义在纸张层区块，运行时已存在） */
function appendEmoTagLine(bind, emotion) {
  const paths = (EMO_PATHS[bind] || [emotion]).map(e => EMO_CN[e] || e).join('/');
  const color = (typeof EMO_COLOR !== 'undefined' && EMO_COLOR[emotion]) || '#9a9a9a';
  const div = document.createElement('div');
  div.className = 'line emo-tag';
  div.textContent = `[情感：${paths}]`;
  div.style.color = color;  el.lines.appendChild(div);

  const all = el.lines.querySelectorAll('.line');
  all.forEach(d => d.classList.remove('latest'));
  // 标签行不抢 latest（白字）：保持历史文本的暗色语感，只以情感色区分
  state.shownLineCount++;
  state.followBottom = true;
  layout();
}

/* 诗句引用块：多行诗合并为一个段落，内部换行（无段间距），左侧浅灰竖线+缩进 */
function appendQuote(sp, lines) {
  const div = document.createElement('div');
  div.className = 'line quote';
  div.innerHTML = lines.map(fmt).join('<br>');
  el.lines.appendChild(div);

  const all = el.lines.querySelectorAll('.line');
  all.forEach(d => d.classList.remove('latest'));
  div.classList.add('latest');

  setAvatar(sp);
  AudioSys.duckMusic();               // 台词进场：音乐俯身让位

  state.shownLineCount++;
  state.followBottom = true;
  layout();
}

function showChoices(node) {
  let ch = '<div class="choice">';
  let n = 0;
  visibleOpts(node).forEach(x => {
    ch += `<div class="opt" data-i="${n}">${n+1}. ${fmt(x.o.label)}</div>`;
    n++;
  });
  ch += '</div>';
  el.lines.insertAdjacentHTML('beforeend', ch);
  el.lines.querySelectorAll('.opt').forEach(node => {
    node.addEventListener('click', () => pickChoice(parseInt(node.dataset.i,10)));
  });
  layout();
}

/* 文本垂直定位：底视图=最新行底 y:860；顶视图=最旧行顶 y:108 */
function contentBottom() {
  const kids = el.lines.children;
  if (!kids.length) return 0;
  const last = kids[kids.length - 1];
  return last.offsetTop + last.offsetHeight;
}
function layout() {
  const total = contentBottom();
  const autoT = 860 - total;
  if (state.followBottom) state.curT = autoT;
  const lo = Math.min(108, autoT);
  const hi = Math.max(108, autoT);
  state.curT = Math.min(hi, Math.max(lo, state.curT));
  el.lines.style.transform = `translateY(${state.curT}px)`;
}
function toward(cur, target, step) {
  return cur < target ? Math.min(target, cur + step) : Math.max(target, cur - step);
}

/* ============ 节点播放器 ============ */
function fireSegment(seg) {
  const nodes = typeof seg.nodes === 'function' ? seg.nodes() : (seg.nodes || []);
  if (!nodes.length) {              // 空段（如暴雪触发，只 set flag）：不惊动文本栏
    (seg.sets || []).forEach(k => flags[k] = true);
    applyTrack(seg);
    PaperMarks.refresh();            // 空段不走 state.seg 路径，这里单独同步（flag 已置位）
    setTimeout(() => { if (seg.onEnd) seg.onEnd(); else afterSegmentClosed(); }, 60);
    return;
  }
  state.seg = seg;
  PaperMarks.refresh();     // 防御性同步：任何段启动即刻按场景/段落状态重算标记显隐
  state.nodes = nodes;
  state.pos = 0;
  el.lines.innerHTML = '';
  state.curT = 0; state.followBottom = true; state.shownLineCount = 0;
  el.avatar.style.display = 'none';
  AudioSys.resetSpeaker();   // 新文本栏周期：段首第一个有声说话者触发签音
  updateHotspots();
  el.textbox.classList.add('open');
  renderNode();
}

/* 行/引用块显示后：决定按钮形态（末行=结束；选项紧接=直接展示；其余=继续） */
function showAdvanceForNext() {
  const cur = state.nodes[state.pos];
  if (!cur) {
    el.advance.classList.add('end');
    el.advance.style.display = 'block';
  } else if (cur.t === 'choice') {
    el.advance.style.display = 'none';
    showChoices(cur);
  } else {
    el.advance.classList.remove('end');
    el.advance.style.display = 'block';
  }
}

function renderNode() {
  if (!state.seg) return;
  if (state.pos >= state.nodes.length) { finalizeSegment(); return; }
  const node = state.nodes[state.pos];

  if (node.t === 'line') {
    appendLine(node.sp, node.txt);
    state.pos++;
    showAdvanceForNext();

  } else if (node.t === 'quote') {
    appendQuote(node.sp, node.lines);
    state.pos++;
    showAdvanceForNext();

  } else if (node.t === 'choice') {
    if (!visibleOpts(node).length) {   // 无可见选项（多选重显时全被 cond 滤掉）：接续 shared 或跳过
      const rest = (node.multi && node.shared) ? node.shared : [];
      state.nodes.splice(state.pos, 1, ...rest);
      renderNode();
    } else {
      el.advance.style.display = 'none';
      showChoices(node);
    }

  } else if (node.t === 'set') {
    flags[node.key] = true;
    state.pos++;
    renderNode();

  } else if (node.t === 'bg') {       // #[bgXX.png]：交叉淡化切换，粘性沿用
    switchBg(node.img, node.dur);
    state.pos++;
    renderNode();

  } else if (node.t === 'mus') {      // 音乐进场（会话B起），静默节点不占一次点击
    AudioSys.startMusic();
    state.pos++;
    renderNode();

  } else if (node.t === 'item') {     // #[±itemXX.png]：物件层加减（粘性，可多层共存；状态切换=减旧加新）
    if (node.op === '+') ItemSys.add(node.img, node.dur); else ItemSys.remove(node.img, node.dur);
    state.pos++;
    renderNode();

  } else if (node.t === 'tint') {     // #[±tintXX.png]：调色罩层加减（粘性，可多层；盖 bg+item 使物件融入环境）
    if (node.op === '+') TintSys.add(node.img, node.dur); else TintSys.remove(node.img, node.dur);
    state.pos++;
    renderNode();

  } else if (node.t === 'tag') {      // {tag:情感, bind:物象}：物象赋情（静默，不占一次点击）
    emotions[node.bind] = node.emotion;
    // 情感标签行（2026-09-06）：选项已化为历史文本时，在标签生效位置插入
    // "[情感：哀/思]"——列出该物象的全部可能情感路径，字色=当前情感色
    appendEmoTagLine(node.bind, node.emotion);
    state.pos++;
    renderNode();

  } else if (node.t === 'inc') {      // {inc:计数器}：递增（静默）
    counters[node.name] = (counters[node.name] || 0) + node.n;
    state.pos++;
    renderNode();

  } else if (node.t === 'fn') {         // 通用静默函数节点（如 Phase 0 垫底进出），不占一次点击
    node.fn();
    state.pos++;
    renderNode();

  } else if (node.t === 'close') {
    finalizeSegment();
  }
}

/* 选择选项：选项区消失，选项文字以"你 - "声线行保留，分支文本自动接续
 * 选项级条件（marked `*a [xx] {cond}`）：cond 不满足的不显示；pick 参数=可见选项序号
 * 分支动态（marked `--- {condition:}` 同条件差分）：opt.lines 可为函数，选择时求值 */
function visibleOpts(node) {
  return node.opts.map((o, k) => ({ o, k })).filter(x => !x.o.cond || x.o.cond());
}
function pickChoice(i) {
  const node = state.nodes[state.pos];
  if (!node || node.t !== 'choice') return;
  const vis = visibleOpts(node);
  const x = vis[i];
  if (!x) return;
  // 移除当前显示的选项块（带编号原文不再保留，只留"你 - "行）
  const shown = el.lines.querySelectorAll('.choice');
  if (shown.length) shown[shown.length - 1].remove();
  const opt = x.o;
  const chosen = L(opt.sp || 'pl', opt.label);
  const branch = typeof opt.lines === 'function' ? opt.lines() : (opt.lines || []);
  const insert = [chosen, ...branch];
  if (node.multi) {
    // 其余选项惰性重显：cond 在渲染时求值（marked `*a` 语义——如枯木两步：
    // 仰头分支内 SET canopy 后，拂雪的 cond 才为真，同一次访问内解锁第二步）
    const others = node.opts.filter(o => o !== opt);
    if (others.length || (node.shared && node.shared.length)) {
      insert.push({ t:'choice', multi:true, opts:others, shared:node.shared });
    }
  }
  state.nodes.splice(state.pos, 1, ...insert);
  renderNode();
}

/* ============ 音效系统：点击音（干+湿声链）+ 风雪底床 + 音乐层（Satie Gnossiennes 原版） ============
 * 混音定案：底床=风雪 30% 音量；湿声=47%（delay 85ms / 反馈 30% / 低通 2200，wet≈0.38）
 * 注意：button_continue_clicked.wav 由试音台导出时已烘焙少量湿声（~0.15），叠加后总湿声略高于试音台实测，
 *       如觉过湿，调低下方 WET_GAIN 即可（单一常量）。
 * AudioSys.setBedVolume(v, fade) 预留给叙事锚点（会话C风雪渐强 / 生火后稍退），暂不接线。
 * 音乐层：MUS() 节点触发进场（会话B起）；每条新文本 duckMusic() 让位再回涨。
 * 说话者签音（2026-08-26 定案，当晚改版）：[00]/'pl' 无签音——无声=内在，点击音即玩家之声。
 * 两条触发路径：
 *   ① 继续按钮（用户手势）：预查下一行讲话者——01/02/03 → speaker.wav 即时取代普通点击音
 *      （button_continue_clicked 不播）；00/选项/段尾/过场 → 普通点击音。
 *   ② auto 段触发（无点击）：fireSegment→resetSpeaker 后段首首个有声者延迟 ~200ms 随文本亮相（"他开口了"）。
 * [01]/[02]/[03] 暂统一 speaker.wav，将来分人合成时换 Web Audio 链（[01]湿/[02]干）。
 * 音量旋钮：BED_VOL（风雪床）/ WET_GAIN（点击湿声）/ MUSIC_VOL（音乐）/ SIG_VOL（签音）。
 * 用户音量（2026-08-31 接线 menu 滑杆）：VOL.amb=底床总线 / VOL.sfx=其余全部音效总线
 * （点击干湿声/签音/音乐），初始各 50%，0%=无声；setVolumes 由 menu 音频滑杆驱动。 */
const AudioSys = (() => {
  const WET_GAIN  = 0.38;   // 47% 湿声
  const BED_VOL   = 0.30;   // 底床基准音量 30%（用户 amb 滑杆在此之上缩放）
  const MUSIC_VOL = 0.30;   // 音乐音量（duck 至 85%）
  const MUSIC_ON  = false;  // 2026-08-25 用户觉进场突兀，先停用音乐；重新启用改 true（MUS 节点已留）
  const MUSIC_URL = 'sound/Satie - Gnossiennes - 副本.mp3';
  const SIG_URL   = 'sound/speaker.wav';        // 签音素材（临时三声统一；水滴声方案已弃）
  const SIG_VOL   = 0.5;    // 素材响度未知，起步 0.5，试听后调
  const SIG_DELAY = 200;    // ms：随文本亮相，与点击音（0-240ms）错开
  const SIG_SP    = { '01':1, '02':1, '03':1 };   // 有签音的说话者；[00]/'pl' 只更新记忆不出声
  const VOL = { amb: 0.5, sfx: 0.5 };   // 用户音量（menu 滑杆）：amb=底床 sfx=全部音效
  let ambBus = null, sfxBus = null;      // 用户音量总线（插在各源与 master 之间）
  let ctx = null, master = null, clickBus = null, clickBuf = null, bed = null;
  let musicGain = null, musicStarted = false, legacyEl = null;
  let lastSpeaker = null, sigTimer = null, sigPool = null;

  function makeClickChain(ac, dest) {
    const bus = ac.createGain(); bus.connect(dest);                 // 干声
    const dl = ac.createDelay(1); dl.delayTime.value = 0.085;       // 湿声链
    const fb = ac.createGain(); fb.gain.value = 0.3;
    const wlp = ac.createBiquadFilter(); wlp.type='lowpass'; wlp.frequency.value = 2200;
    const wet = ac.createGain(); wet.gain.value = WET_GAIN;
    bus.connect(dl); dl.connect(wlp); wlp.connect(fb); fb.connect(dl);
    wlp.connect(wet); wet.connect(dest);
    return bus;
  }

  function makePink(ac) {   // 粉噪（Paul Kellet 近似），2s 循环
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < len; i++) {
      const w = Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
    }
    return buf;
  }

  function startBed() {     // 风雪底床：粉噪→低通420→0.07Hz 起伏，从 0 淡入至 30%
    const src = ctx.createBufferSource(); src.buffer = makePink(ctx); src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.5;
    const wg = ctx.createGain(); wg.gain.value = 0.5;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = ctx.createGain(); lfoG.gain.value = 0.22;
    lfo.connect(lfoG); lfoG.connect(wg.gain);
    const g = ctx.createGain(); g.gain.value = 0;
    src.connect(lp); lp.connect(wg); wg.connect(g); g.connect(ambBus);   // 底床 → amb 总线（用户滑杆）
    src.start(); lfo.start();
    g.gain.setTargetAtTime(BED_VOL, ctx.currentTime, 1.2);
    bed = { g };
  }

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;                       // 无头环境（sim.js）：静默降级
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      ambBus = ctx.createGain(); ambBus.gain.value = VOL.amb; ambBus.connect(master);   // 底床用户音量
      sfxBus = ctx.createGain(); sfxBus.gain.value = VOL.sfx; sfxBus.connect(master);   // 其余音效用户音量
      clickBus = makeClickChain(ctx, sfxBus);                                           // 点击干+湿声 → sfx 总线
      fetch('sound/button_continue_clicked.wav')
        .then(r => r.arrayBuffer())
        .then(b => ctx.decodeAudioData(b))
        .then(buf => { clickBuf = buf; })
        .catch(()=>{});
      startBed();
    } catch (e) { ctx = null; return false; }
    return true;
  }

  function playClick() {
    if (!init()) { legacyClick(); return; }
    if (ctx.state === 'suspended') ctx.resume();
    if (!clickBuf) { legacyClick(); return; }    // fetch 失败（file://）或未解码完：回退干声
    const s = ctx.createBufferSource(); s.buffer = clickBuf;
    s.connect(clickBus);
    s.start();
  }

  function legacyClick() {                        // file:// 下 fetch 被禁：纯 <audio> 干声（无湿声链）
    try {
      if (!legacyEl) legacyEl = new Audio('sound/button_continue_clicked.wav');
      legacyEl.currentTime = 0;
      legacyEl.volume = VOL.sfx;
      legacyEl.play().catch(()=>{});
    } catch (e) {}
  }

  /* ---- 音乐层：Satie Gnossiennes 原版（363s 循环；起止静音内做淡入淡出 + 峰值归一化） ---- */
  function startMusic() {
    if (!MUSIC_ON) return;               // 停用开关
    if (musicStarted) return;
    if (!init()) return;
    musicStarted = true;
    if (ctx.state === 'suspended') ctx.resume();
    musicGain = ctx.createGain();
    musicGain.gain.value = 0;
    musicGain.connect(sfxBus || master);   // 音乐归 sfx 总线（用户音效滑杆）
    fetch(encodeURI(MUSIC_URL))
      .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(b => ctx.decodeAudioData(b))
      .then(buf => {
        const src = ctx.createBufferSource();
        src.buffer = shapeLoop(buf);
        src.loop = true;
        src.connect(musicGain);
        src.start();
        musicGain.gain.setTargetAtTime(MUSIC_VOL, ctx.currentTime, 2.0);
      })
      .catch(() => {                              // file:// 回退：<audio loop> + MediaElementSource
        const a = new Audio(MUSIC_URL);
        a.loop = true;
        try {
          const s = ctx.createMediaElementSource(a);
          s.connect(musicGain);
          a.play().catch(()=>{});
          musicGain.gain.setTargetAtTime(MUSIC_VOL, ctx.currentTime, 2.0);
        } catch (e) {}
      });
  }

  /* 就地处理：首尾淡入淡出 1.2s + 峰值归一化到 0.7（循环接缝无爆音；首部静音=循环间自然呼吸） */
  function shapeLoop(buf) {
    try {
      const chans = [];
      for (let c = 0; c < buf.numberOfChannels; c++) chans.push(buf.getChannelData(c));
      const n = buf.length, thr = 0.004;
      const loud = i => chans.some(d => Math.abs(d[i]) > thr);
      let s0 = 0; while (s0 < n && !loud(s0)) s0++;
      let s1 = n - 1; while (s1 > s0 && !loud(s1)) s1--;
      if (s1 - s0 > buf.sampleRate) {
        const fade = Math.floor(buf.sampleRate * 1.2);
        for (const d of chans) {
          for (let i = 0; i < fade && s0 + i <= s1; i++) d[s0 + i] *= i / fade;
          for (let i = 0; i < fade && s1 - i >= s0; i++) d[s1 - i] *= i / fade;
        }
      }
      let peak = 0;
      for (const d of chans) for (let i = s0; i <= s1; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; }
      if (peak > 0.001) {
        const g = Math.min(2.5, 0.7 / peak);
        if (g !== 1) for (const d of chans) for (let i = s0; i <= s1; i++) d[i] *= g;
      }
    } catch (e) {}
    return buf;
  }

  /* 台词进场让位：俯身到 85%，再慢慢回涨（2026-08-25 用户定：让位幅度收小） */
  function duckMusic() {
    if (!musicGain || !ctx) return;
    const t = ctx.currentTime;
    musicGain.gain.cancelScheduledValues(t);
    musicGain.gain.setTargetAtTime(MUSIC_VOL * 0.85, t, 0.06);
    musicGain.gain.setTargetAtTime(MUSIC_VOL, t + 0.5, 1.2);
  }

  function setBedVolume(v, fade) {               // 叙事锚点预留：v=目标音量，fade=时间常数(s)
    if (!bed || !ctx) return;
    bed.g.gain.setTargetAtTime(v, ctx.currentTime, fade || 0.5);
  }

  /* ---- 说话者签音：换人才触发（感知换人≠文本段结构；demo 中 `<` 连续段已合并为段内，天然保持记忆） ---- */
  function speakerOn(sp) {
    if (sp === lastSpeaker) return;
    lastSpeaker = sp;
    if (!SIG_SP[sp]) return;                     // [00]/'pl'：无签音（无声=内在；点击音即玩家之声）
    clearTimeout(sigTimer);                      // 200ms 内连续换人：只播最新说话者，不叠两声
    sigTimer = setTimeout(playSignature, SIG_DELAY);
  }
  function resetSpeaker() {                      // fireSegment 时调：新文本栏周期，段首首个有声者触发（"他开口了"）
    lastSpeaker = null;
    clearTimeout(sigTimer);
  }
  function clickFeedback(sp) {                   // 继续按钮点击分流（2026-08-26 晚定案）
    if (SIG_SP[sp]) {
      lastSpeaker = sp;                          // 占位：随后的 setAvatar→speakerOn 同人不重复触发
      clearTimeout(sigTimer);
      playSignature();                           // 签音即时=点击反馈，取代 button_continue_clicked
    } else {
      playClick();                               // 00/pl/选项/段尾/过场：普通点击音
    }
  }
  function playSignature() {
    if (typeof Audio === 'undefined') return;    // 无头环境（sim.js）静默降级
    try {
      if (!sigPool) sigPool = [new Audio(SIG_URL), new Audio(SIG_URL)];   // 池：素材短，2 个防快速连播截断
      const a = sigPool.find(x => x.paused) || sigPool[0];
      a.currentTime = 0;
      a.volume = SIG_VOL * VOL.sfx;
      a.play().catch(()=>{});                    // 开场首句（尚无用户手势）可能被 autoplay 策略拦：静默即可
    } catch (e) {}
  }

  function setVolumes(amb, sfx) {                 // menu 音频滑杆驱动：amb=底床 sfx=全部音效（0~1）
    VOL.amb = amb; VOL.sfx = sfx;
    if (ctx) {
      const t = ctx.currentTime;
      try { ambBus.gain.setTargetAtTime(amb, t, 0.05); } catch (e) {}
      try { sfxBus.gain.setTargetAtTime(sfx, t, 0.05); } catch (e) {}
    }
    try { if (legacyEl) legacyEl.volume = sfx; } catch (e) {}
    try { if (sigPool) sigPool.forEach(a => { a.volume = SIG_VOL * sfx; }); } catch (e) {}
  }
  function volState() { return { amb: VOL.amb, sfx: VOL.sfx, ctx: !!ctx, buses: !!(ambBus && sfxBus) }; }

  return { init, playClick, setBedVolume, setVolumes, volState, startMusic, duckMusic, speakerOn, resetSpeaker, clickFeedback };
})();

/* 首次任意交互即解锁底床（选项/热点先行时风雪也不迟到）；无头环境安全 */
if (typeof document.addEventListener === 'function') {
  document.addEventListener('pointerdown', () => { try { AudioSys.init(); } catch(e){} }, { once:true });
}

/* 预查即将渲染的讲话者（从 state.pos 起穿透 set/bg/mus/item/tint 静默节点；
 * 选项=玩家接过话头、close=段尾、段尽=null——均无签音预告，走普通点击音） */
function peekNextSpeaker() {
  for (let i = state.pos; i < state.nodes.length; i++) {
    const n = state.nodes[i];
    if (n.t === 'line' || n.t === 'quote') return n.sp;
    if (n.t === 'choice' || n.t === 'close') return null;
  }
  return null;
}

/* 继续 / 结束 */
el.advance.addEventListener('click', () => {
  if (!state.seg) return;
  const cur = state.nodes[state.pos];
  if (cur && cur.t === 'choice') return;     // 选项：不播放
  if (!cur) { finalizeSegment(); return; }    // 结束按钮（button_end）：不播放
  AudioSys.clickFeedback(peekNextSpeaker());  // 下一行 01/02/03 → speaker.wav 即时（取代点击音）；00/pl/段尾 → button_continue_clicked
  el.advance.classList.remove('end');
  renderNode();   // renderNode 处理 nodes[pos] 并自行推进，此处不可再 pos++（否则跳行）
});

/* 键盘操作（2026-08-28）：数字键 1~9 = 选择当前选项（与显示编号一致）；Enter = 继续/结束按钮 */
window.addEventListener('keydown', (e) => {
  if (e.repeat || !state.seg) return;
  const cur = state.nodes[state.pos];
  if (cur && cur.t === 'choice') {
    if (!/^[1-9]$/.test(e.key)) return;
    const i = e.key.charCodeAt(0) - 49;              // '1'→0 …
    if (i < visibleOpts(cur).length) { e.preventDefault(); pickChoice(i); }
    return;
  }
  if (e.key === 'Enter') { e.preventDefault(); el.advance.click(); }   // 与鼠标同路径（含点击音）
});

/* ============ 背景切换（#[bgXX.png {fade:秒}]，交叉淡化默认 0.6s） ============
 * 纸张底图（#[paperXX.png]）也走本通道：替换语义（非加减），
 * 路径按前缀分流——paperXX.png → art/paper/，其余 → art/background/ */
function bgDirOf(img) { return /^paper/.test(img) ? 'art/paper/' : 'art/background/'; }
/* 竞态防护（2026-08-28）：上一笔切换的延迟提交定时器（ms+60ms）可能在下一笔切换
   已提交之后才触发，把旧图写回 el.bg —— 表现为"bg10 短暂出现又被 bg09 顶掉"。
   bgLatest=最近一次开始切换的图（作废过期定时器）；bgPendingFade=仍在淡入的淡层
   （新切换开始时立即兑现，防止旧淡层盖在新 bg 上闪现） */
let bgLatest = null, bgPendingFade = null;

/* 音频注释明暗自适应：每个 bg 最左 200px 区域的平均亮度（离线预计算，PIL 按
   0.299R+0.587G+0.114B 采样）。低于中性灰 128 → 注释反白（.on-dark，纯黑素材 invert）；
   ≥128 保持黑。新增 bg 素材后需重算补表（未知 bg 默认暗景→白注释） */
const BG_LUMA = {
    'bg00.png': 1,
    'bg01.png': 13,
    'bg02.png': 13,
    'bg03.png': 10,
    'bg04.png': 7,
    'bg05.png': 6,
    'bg06.png': 5,
    'bg07.png': 6,
    'bg08.png': 150,
    'bg09.png': 17,
    'bg10.png': 128,
    'bg13.png': 120,
    'bg14.png': 39,
    'bg15.png': 64,
    'bg16.png': 149,
    'bg17.png': 40,
    'bg18.png': 32,
    'bg19.png': 102,
    'bg20.png': 43,
    'bg21.png': 17,
    'bg22.png': 16,
    'bg23.png': 125,
    'bg29.png': 124,
    'bg30.png': 38,
    'bg31.png': 20,
    'paper_01.png': 149
};
function updateAudIconLuma(img) {
  const l = (img && BG_LUMA[img] !== undefined) ? BG_LUMA[img] : 0;   // 未知 bg 默认暗（白注释）
  const panel = document.getElementById('menu-audioopt');
  if (panel) panel.classList.toggle('on-dark', l < 128);
}

function switchBg(img, dur) {
  const ms = dur || 600;
  const doSwitch = () => {
    if (bgPendingFade) {                    // 兑现上一笔未完成的淡入（如 bg09 {fade:1.5} 还在途中）
      el.bg.style.backgroundImage = bgPendingFade.style.backgroundImage;
      bgPendingFade.remove();
      bgPendingFade = null;
    }
    bgLatest = img;
    updateAudIconLuma(img);                     // 音频注释明暗自适应（最左 200px 亮度 <128 反白）
    PaperMarks.refresh();                       // 标记层跟纸面走：切纸/切离即刻同步显隐
    /* 纸张色调统一罩（2026-08-30 用户定案）：主界面为纸地图（paperXX 底图）时
       paper_tint 始终挂最上层（tint 层 DOM 在 items 之后，天然盖住全部纸张物象层）；
       切离纸地图即撤。引擎级常驻行为，不走 marked 标注（PAPER_LIST 记档） */
    if (/^paper/.test(img)) TintSys.add('paper_tint.png');
    else                     TintSys.remove('paper_tint.png');
    const fade = document.createElement('div');
    fade.className = 'bg-fade';
    fade.style.backgroundImage = `url("${bgDirOf(img)}${img}")`;
    fade.style.transitionDuration = ms + 'ms';   // {fade:秒} 修饰符：本次切换时长
    el.stage.appendChild(fade);
    bgPendingFade = fade;
    const raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window)
                                             : (fn) => setTimeout(fn, 16);
    raf(() => fade.classList.add('show'));
    setTimeout(() => {
      if (bgLatest !== img) { fade.remove(); return; }   // 已被更新的切换接管，不再写回
      el.bg.style.backgroundImage = `url("${bgDirOf(img)}${img}")`;
      fade.remove();
      if (bgPendingFade === fade) bgPendingFade = null;
    }, ms + 60);
  };
  /* 缺图保护：素材未到时保持上一张 bg 不切换；
     无头环境无 Image 构造器（sim.js）→ 直接切换 */
  if (typeof Image !== 'function') { doSwitch(); return; }
  const pre = new Image();
  pre.onload = () => doSwitch();
  pre.onerror = () => console.warn('[bg] 素材缺失，保持上一张背景：', img);
  pre.src = bgDirOf(img) + img;
}

/* 调试出口（仅测试用，不影响运行）：浏览器控制台/agent-browser 经 window.__DBG 直接
   调 switchBg 复现竞态、读写 flags/counters/state、手动进场景/触发段 */
window.__DBG = { switchBg, el, flags, counters, emotions, state, enterScene, fireSegment, SCENES,
                  get paperMarks() { return PaperMarks; },        // getter：PaperMarks 定义在本行之后（TDZ 规避）
                  audioVol: () => AudioSys.volState() };

/* ============ menu 按键组（左缘竖列）：展开 / 收起 ============
   点击主键 → 主键淡出，四个功能键自下而上错峰弹出（返回主页→画面→音频→语言→收起键）；
   点击收起小键（向下三角）→ 整组向下收回淡出，主键复原。
   功能键为占位（语言/音频/画面/返回主页的逻辑待后续），重置定在主页不做进菜单。
   图待美术：menu_lang/audio/display/home_CH.png（280×700）+ menu_collapse.png（280×280 方形，图已到齐），
   缺图时按钮隐形但交互骨架就位 */
const MenuSys = (() => {
  const main = document.getElementById('menu');
  const items = ['menu-home','menu-display','menu-audio','menu-lang','menu-collapse']
    .map(id => document.getElementById(id)).filter(Boolean);
  const langopt = document.getElementById('menu-langopt');
  let timers = [];
  let open = false;
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function expand() {                       // 展开：主键淡出，功能键自下而上弹出
    clearTimers();
    open = true;
    main.classList.add('hidden');
    items.forEach((el, i) => timers.push(setTimeout(() => el.classList.add('open'), i * 60)));
  }
  function collapse() {                     // 收起：整组向下收回淡出（自上而下收拢），主键复原
    clearTimers();
    open = false;
    items.slice().reverse().forEach((el, i) => timers.push(setTimeout(() => el.classList.remove('open'), i * 40)));
    timers.push(setTimeout(() => main.classList.remove('hidden'), items.length * 40 + 160));
    if (langopt) langopt.classList.remove('out');   // 语言选项键一并收回
    if (dispopt) dispopt.classList.remove('out');   // display 选项键一并收回
    if (audioopt) audioopt.classList.remove('out'); // audio 选项键一并收回
    if (homeopt) homeopt.classList.remove('out');   // 返回主页确认面板一并收回
  }
  if (main) main.addEventListener('click', expand);
  const tri = document.getElementById('menu-collapse');
  if (tri) tri.addEventListener('click', collapse);

  /* ---- 语言切换（UI 先行）：menu_lang 点击弹出/收回选项键；点选项键 CH⇄EN ----
     每次切换：主键+四功能键+选项键全部换 _CH/_EN 图；文本栏重渲染暂缓（英文文本未备） */
  let lang = 'CH';
  const dispopt = document.getElementById('menu-dispopt');
  function applyLang() {
    const pairs = [
      ['menu',      'menu'],       // 主键 menu_CH/EN.png
      ['menu-lang', 'menu_lang'],  ['menu-audio', 'menu_audio'],
      ['menu-display', 'menu_display'], ['menu-home', 'menu_home'],
      ['menu-langopt', 'menu_langopt'],
      ['menu-dispopt-full', 'menu_dispopt'], ['menu-dispopt-win', 'menu_dispopt']
    ];
    pairs.forEach(([id, base]) => {
      const elb = document.getElementById(id);
      if (elb) elb.style.backgroundImage = 'url("art/menu/' + base + '_' + lang + '.png")';
    });
    const ho = document.getElementById('menu-homeopt');     // 返回主页确认面板：三区块精灵共用一图（CSS 变量继承）
    if (ho) ho.style.setProperty('--ho-img', 'url("art/menu/menu_homeopt_' + lang + '.png")');
    const sv = document.getElementById('save-icon');        // 存档提示图：save_CH/EN.png
    if (sv) sv.style.backgroundImage = 'url("art/menu/save_' + lang + '.png")';
    /* TODO 语言系统接入：此处调用文本栏重渲染（当前可见行按语言重建） */
  }
  const langBtn = document.getElementById('menu-lang');
  if (langBtn) langBtn.addEventListener('click', () => {
    closeOtherOpts(langopt);                        // 互斥：收起其他主键的次级面板
    if (langopt) langopt.classList.toggle('out');   // 从左侧隐藏处向右弹出 / 收回
  });
  if (langopt) langopt.addEventListener('click', () => {
    lang = (lang === 'CH') ? 'EN' : 'CH';           // 点一下换另一张，再点换回
    applyLang();
  });
  applyLang();                                      // 初始 CH 态铺图

  /* ---- display 选项：menu_display 点击弹出/收回；一张图上下两框=两个独立小按钮 ----
     上框=全屏、下框=窗口；点击申请/退出全屏，选中态由 fullscreenchange 驱动
     （F 键/ESC/本键将来同源同步）；选中=常态、未选=暗淡（.sel/.unsel） */
  const dispFull = document.getElementById('menu-dispopt-full');
  const dispWin  = document.getElementById('menu-dispopt-win');
  function applyDispSel() {
    const full = !!(document.fullscreenElement);
    if (dispFull) { dispFull.classList.toggle('sel', full);   dispFull.classList.toggle('unsel', !full); }
    if (dispWin)  { dispWin.classList.toggle('sel', !full);   dispWin.classList.toggle('unsel', full); }
  }
  if (dispFull) dispFull.addEventListener('click', () => {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      try { const r = document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(()=>{}); } catch (e) {}
    }
  });
  if (dispWin) dispWin.addEventListener('click', () => {
    if (document.fullscreenElement && document.exitFullscreen) {
      try { const r = document.exitFullscreen(); if (r && r.catch) r.catch(()=>{}); } catch (e) {}
    }
  });
  if (document.addEventListener) document.addEventListener('fullscreenchange', applyDispSel);
  applyDispSel();                                   // 初始态=当前实际（窗口）
  const dispBtn = document.getElementById('menu-display');
  if (dispBtn) dispBtn.addEventListener('click', () => {
    closeOtherOpts(dispopt);                        // 互斥：收起其他主键的次级面板
    if (dispopt) dispopt.classList.toggle('out');   // 从左侧隐藏处向右弹出 / 收回
  });

  /* ---- audio 选项：menu_audio 点击弹出/收回；双竖向滑杆（左=环境 右=音效）----
     滑块顶=100%、底=0%；拖拽或点按轨道调值（白方块中心跟随指针）；
     行程按美术实测：轨道黑条 y 67~646（源像素），白方块 y 67~116（画在轨道顶=100% 默认位），
     滑块层=全幅 40×100 平移——方块顶贴轨道顶 ↔ 方块底贴轨道底；
     值暂存内存（音频系统接入时消费 + localStorage 持久化，TODO） */
  const audioopt = document.getElementById('menu-audioopt');
  const AUD = { amb: 0.5, sfx: 0.5 };               // 环境音量 / 音效音量（0~1，初始 50%；0%=无声）
  const SQ_CENTER = 91.5 / 7;                       // 白方块中心距滑块层顶（源 91.5px ÷7）
  const TRAVEL    = 530 / 7;                        // 行程（源 646-116=530px ÷7 ≈ 75.7 显示 px）
  function renderThumb(slider, v) {
    const th = slider.querySelector('.aud-thumb');
    if (th) th.style.transform = 'translateY(' + ((1 - v) * TRAVEL).toFixed(2) + 'px)';
  }
  function makeSlider(id, key) {
    const sl = document.getElementById(id);
    if (!sl) return;
    let dragging = false;
    const setFromY = (clientY) => {
      const r = sl.getBoundingClientRect();
      if (!r || !r.width) return;
      const s = r.width / 40;                        // 方案A 舞台缩放比
      const y = (clientY - r.top) / s;               // → 滑杆局部 y（0~100）
      let t = (y - SQ_CENTER) / TRAVEL;              // 平移比例（顶=0）
      t = Math.max(0, Math.min(1, t));
      AUD[key] = 1 - t;                              // 顶=100%、底=0%
      renderThumb(sl, AUD[key]);
      AudioSys.setVolumes(AUD.amb, AUD.sfx);         // 实际接线：amb=底床总线 sfx=其余全部音效总线
    };
    sl.addEventListener('mousedown', e => {
      dragging = true;
      setFromY(e.clientY);
      if (e.preventDefault) e.preventDefault();
    });
    if (document.addEventListener) {
      document.addEventListener('mousemove', e => { if (dragging) setFromY(e.clientY); });
      document.addEventListener('mouseup', () => { dragging = false; });
    }
    renderThumb(sl, AUD[key]);                       // 初始 50%（方块在轨道中点）
  }
  makeSlider('menu-audamb', 'amb');
  makeSlider('menu-audsfx', 'sfx');
  const audBtn = document.getElementById('menu-audio');
  if (audBtn) audBtn.addEventListener('click', () => {
    closeOtherOpts(audioopt);                        // 互斥：收起其他主键的次级面板
    if (audioopt) audioopt.classList.toggle('out');  // 从左侧隐藏处向右弹出 / 收回
  });

  /* ---- 返回主页确认面板：menu_home 点击弹出；× 收回整面板（向左弹回+淡出）；
     √ 确认回主页——动作暂不挂载（主页/存档系统未建，TODO）---- */
  const homeopt = document.getElementById('menu-homeopt');
  const homeBtn = document.getElementById('menu-home');
  if (homeBtn) homeBtn.addEventListener('click', () => {
    closeOtherOpts(homeopt);                        // 互斥：收起其他主键的次级面板
    if (homeopt) homeopt.classList.toggle('out');   // 从左侧隐藏处向右弹出 / 收回
  });
  const hoNo = document.getElementById('menu-homeopt-no');
  if (hoNo) hoNo.addEventListener('click', () => {
    if (homeopt) homeopt.classList.remove('out');   // ×：整面板向左弹回收起，透明度降为 0
  });
  const hoYes = document.getElementById('menu-homeopt-yes');
  if (hoYes) hoYes.addEventListener('click', () => {
    /* TODO 返回主页：落自动存档 → 切换到主界面（主页系统未建，暂不挂载） */
  });

  /* 互斥（2026-08-31 定案）：四个主键的次级面板同时最多展开一个——
     点开下一个主键时，其余次级面板向左弹回收起、透明度归 0 */
  function closeOtherOpts(except) {
    [langopt, dispopt, audioopt, homeopt].forEach(o => {
      if (o && o !== except) o.classList.remove('out');
    });
  }

  /* light-dismiss：菜单展开时，点击菜单组以外的任意区域即收起，且该点击照常生效
     （捕获阶段旁观、不 stopPropagation——继续按钮/物象/选项均一次点击完成两件事）。
     菜单组内部（主键+四功能键+收起三角+语言/display/audio 选项键）不触发；将来若加压暗/结霜遮罩，
     点击自然落在遮罩上转为"只收起不生效"语义，无需在此切换 */
  if (document.addEventListener) {
    document.addEventListener('click', e => {
      if (!open) return;
      const t = e.target;
      if (t && t.closest && t.closest('#menu, .menu-btn, .menu-opt')) return;
      collapse();
    }, true);
  }
  return { expand, collapse };
})();

/* ============ 存档外显（SaveSys）：P1/P2/R1 各区域末尾 ============
   全屏黑屏淡入 → "正在储存进度"闪烁 3 秒（渐变明灭三次，最暗 40%）→ mid()（场景切换在黑幕后发生，
   揭幕即新场景）→ 黑屏淡出。无头环境（sim.js 置 window.__HEADLESS）跳过等待立即续行。
   真实存档数据（flags/counters/emotions 快照）另接：本外显仅为进度感知提示 */
const SaveSys = (() => {
  const veil = document.getElementById('save-veil');
  const icon = document.getElementById('save-icon');
  let busy = false;
  function save(mid) {
    if (window.__HEADLESS) { if (mid) mid(); return; }   // 无头：不等 3.6s，立即续行
    if (!veil || !icon)    { if (mid) mid(); return; }
    if (busy)              { if (mid) mid(); return; }   // 防重入
    busy = true;
    const stage = document.getElementById('stage');
    if (stage) stage.classList.add('saving');            // menu 组浮在黑幕上但不可点
    veil.classList.add('on');
    setTimeout(() => {
      icon.classList.add('blink');
      setTimeout(() => {
        icon.classList.remove('blink');
        if (mid) mid();                                   // 黑幕下切场景
        setTimeout(() => {
          veil.classList.remove('on');
          if (stage) stage.classList.remove('saving');
          busy = false;
        }, 100);
      }, 3000);
    }, 350);
  }
  return { save };
})();

/* ============ 关闭 / 段落收尾 ============ */
function closeTextbox() {
  el.textbox.classList.remove('open');
  setTimeout(() => { el.avatar.style.display = 'none'; }, 260);
}
/* 访问顺序追踪（marked R1 尾部四段 @condition）：大物象完成时记 v1/v2/v3/v4 位置 flag
 * cnt_p3_visited 计数 + v{N}_{物象} flag，供 R2 走马灯文本引用 */
function applyTrack(seg) {
  if (!seg.track || flags[seg.track + '_tracked']) return;
  if (seg.trackCond && !seg.trackCond()) return;   // 两步段（枯木）：仅大物象 flag 置位后才计入访问顺序
  const n = counters.cnt_p3_visited || 0;
  flags['v' + (n + 1) + '_' + seg.track] = true;
  counters.cnt_p3_visited = n + 1;
  flags[seg.track + '_tracked'] = true;
}
function finalizeSegment() {
  const seg = state.seg;
  if (!seg) return;
  (seg.sets || []).forEach(k => flags[k] = true);
  applyTrack(seg);
  state.seg = null;
  PaperMarks.refresh();     // 防御性同步：段收尾（flag 刚置位/seg 已空）即刻重算标记显隐
  closeTextbox();
  setTimeout(() => {
    if (seg.onEnd) { seg.onEnd(); return; }
    afterSegmentClosed();
  }, 320);
}
function afterSegmentClosed() {
  updateHotspots();
  evaluateAuto();
}

/* ============ 场景与触发 ============ */
function enterScene(name) {
  state.scene = name;      // bg 不在此切换：粘性沿用上一个 #[bgXX.png]，直至新标注
  updateHotspots();
  evaluateAuto();
}
function evaluateAuto() {
  if (state.devHold) return;          // 开发跳转切换瞬间抑制 auto 求值（跳转后恢复正常）
  const sc = SCENES[state.scene];
  if (!sc) return;
  for (const seg of sc.segments) {
    if (seg.trigger !== 'auto') continue;
    if (seg.done) continue;
    if (seg.cond && !seg.cond()) continue;
    seg.done = true;
    fireSegment(seg);
    return;
  }
}
function updateHotspots() {
  Object.entries(SCENES).forEach(([name, sc]) => {
    const active = name === state.scene;
    sc.hotspots.forEach(h => {
      const elh = document.getElementById('hs_' + h.id);
      if (!elh) return;
      if (h.item || h.frame) {
        /* 物件/方框热点：圆环 div 永久隐藏（保留承载行为——alpha/方框命中与无头模拟都调它）；
           物件视觉由流内 #[±itemXX.png] 标注加减驱动，方框视觉由 frame 裁片直显，与热点条件解耦 */
        elh.style.display = 'none';
        return;
      }
      const visible = active && (!sc.open || sc.open()) && !state.seg && h.when();
      elh.style.display = visible ? 'block' : 'none';
    });
  });
  updateFrames();
  PaperMarks.refresh();     // 纸张小物象标记层：随场景/段落/flag 状态同步显隐
}

/* ============ 方框标注层（frame）：热点 frame 字段驱动 ============
 * 手绘铅笔框叠 tint/hotspots 之上（z7）；每框独立裁片 art/frame/frameXX_{id}.png——
 * 图片本身就是方框，100% 填充；母图（含全部框的整图）存 art/frame/original/frameXX.png，
 * 运行时零引用，仅供改框重裁。
 * 三态：默认=源图直显 / 悬停=filter 提亮（.frame.hover）/ 已交互=消失（updateFrames 隐藏）。
 *判定：hit() 内方框矩形优先于 alpha（有 frame 的热点不再走 alpha 命中）；
 * 已交互（when 反转）→ 框消失，不可再点。
 * 无 src 的 frame=隐形命中矩形：只提供矩形命中、不渲染视觉框——
 * file:// 下 canvas 被 cross-origin 污染、alphaAt 恒 0（Chromium 限制），alpha 命中不可用时兜底。 */
function updateFrames() {
  const wrap = document.getElementById('frames');
  if (!wrap) return;
  Object.entries(SCENES).forEach(([name, sc]) => {
    const activeScene = name === state.scene;
    sc.hotspots.forEach(h => {
      if (!h.frame) return;
      if (!h.frame.src) return;    // 隐形命中矩形：无视觉框（hit() 矩形判定照常生效）
      let f = document.getElementById('frame_' + h.id);
      if (!f) {
        const fr = h.frame;
        f = document.createElement('div');
        f.id = 'frame_' + h.id;
        f.className = 'frame';
        f.style.left = fr.x + 'px'; f.style.top = fr.y + 'px';
        f.style.width = fr.w + 'px'; f.style.height = fr.h + 'px';
        f.style.setProperty('--f-img', 'url("art/frame/' + fr.src + '")');
        wrap.appendChild(f);
      }
      /* 可见性=场景激活+开放+非段落中，且未交互（交互后框消失） */
      const done = !!(h.when && !h.when());
      const visible = activeScene && (!sc.open || sc.open()) && !state.seg && !done;
      f.style.display = visible ? 'block' : 'none';
      f.classList.toggle('done', done);   /* 语义标记（当前无样式，留作调试/扩展钩子） */
    });
  });
}

/* ============ 物件层（itemXX_N.png，流内 #[+itemXX] / #[-itemXX] 加减驱动，粘性可多层） ============
 * 透明底 1920×1080 PNG 与 bg 对齐叠放；同一物件多状态用 itemXX_1 / itemXX_2（减旧加新）。
 * 点击绑定：热点数据 item 字段（如 p1_01_fire → item01_1.png）——命中只认该图 alpha>阈值像素，
 * 且仅在物件已添加 + 绑定热点当前激活（场景/when/非段落中）时可点；点击转发 hs_xxx 原处理器。
 * 悬停音效钩子预留：setHover 处接 mouse_entered 类音效（待音频接入）。 */

/* 通用渐显渐隐（item / tint 共用）：display 后 opacity 0→1，强制回流确保过渡起步；
 * 渐隐 opacity→0，过渡结束后再隐藏；期间被重新 fadeIn 则不隐藏。dur(ms) 省缺走 CSS 默认 */
function fadeIn(im, dur) {
  const d = dur || 0;
  im.style.display = 'block';
  if (d) im.style.transitionDuration = d + 'ms';
  im.style.opacity = '0';
  void im.offsetHeight;                 // 强制回流
  im.style.opacity = '1';
  if (d) setTimeout(() => {             // 过渡完成后清内联时长，避免拖慢悬停提亮(filter)
    if (im.style.opacity === '1') im.style.transitionDuration = '';
  }, d + 60);
}
function fadeOut(im, dur) {
  if (!im) return;
  const d = dur || 0;
  if (d) im.style.transitionDuration = d + 'ms';
  im.style.opacity = '0';
  setTimeout(() => {
    if (im.style.opacity === '0') im.style.display = 'none';
  }, (d || 500) + 40);
}

/* FxSnow 已删除（2026-09-06 用户定案：R2→R3 不再有任何下雪 effect，含右→左锋面）。
   保留空存根供旧引用（playing 恒 false = 守卫不吞交互；clear 为 no-op）。 */
const FxSnow = { play(){}, clear(){}, get playing(){ return false; } };

/* ============ 纸张小物象标记层（PaperMarks，2026-09-01 定案，2026-09-05 修订显隐规则）============
   小物象方框标准位置（frame_layout.html 排布 JSON 定案）；**不作用于大物象区域内部**
   （区域场景方框沿用各自热点坐标）。显隐跟着纸面走：当前 bg=paperXX 即显示、对应区域
   flag 已置位——R1 途中随探索积累，**R2 不切 bg → 全部照常显示**（后续 fx 在其上实现
   渐白/元素冒出），区域场景（bgXX）与 Phase 0-2 自然隐藏。
   悬停 → 黑色线条渲染为该物象所记录情感（emotions[bind]）的对应色（R2/R3 同源的
   情感数据）。纯回望提示：无点击行为（点击冒泡到 stage 照常坐标命中大物象）。 */
/* ★ 调色入口（唯一两处）：
   EMO_COLOR = 情感五色（hex）；PM_GLOW = 微光参数（brightness 提亮倍数 / 光晕半径 px / 光晕 alpha）。
   SVG 亮度映射矩阵与悬停滤镜链均由此运行时生成，改完刷新即生效 */
const EMO_COLOR = {   // 情感五色
  joy: '#c04a3a',           // 喜 · 朱砂
  sorrow: '#425e8a',        // 哀 · 黛蓝
  ease: '#6c8a54',          // 闲 · 苔绿
  contemplation: '#806aa8', // 思 · 紫黛
  wistful: '#b08a42'        // 惘 · 缃黄
};
const PM_GLOW = { bright: 0.25, blur: 6, alpha: 0.45 };   // 悬停微光参数
function emoRgb(hex) {     // '#rrggbb' → {r,g,b} 0~1
  const n = parseInt(hex.slice(1), 16);
  return { r: ((n >> 16) & 255) / 255, g: ((n >> 8) & 255) / 255, b: (n & 255) / 255 };
}
function emoHoverFilter(emo) {   // 悬停滤镜链：亮度映射染色 + 提亮 + 情感色光晕
  const c = emoRgb(EMO_COLOR[emo]);
  const glow = `rgba(${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)},${PM_GLOW.alpha})`;
  return `url(#pm-${emo}) brightness(${PM_GLOW.bright}) drop-shadow(0 0 ${PM_GLOW.blur}px ${glow})`;
}
(function buildEmoFilters() {     // SVG 滤镜运行时生成：亮度映射矩阵（黑→情感色、白→保持、灰阶插值、alpha 保留）
  if (!document.createElementNS) return;              // 无头环境（sim）跳过——纯视觉，不影响逻辑
  const svg = document.getElementById('pm-filters');
  if (!svg) return;
  const NS = 'http://www.w3.org/2000/svg';
  Object.entries(EMO_COLOR).forEach(([emo, hex]) => {
    const c = emoRgb(hex);
    const f = document.createElementNS(NS, 'filter');
    f.id = 'pm-' + emo;
    const m = document.createElementNS(NS, 'feColorMatrix');
    m.setAttribute('type', 'matrix');
    const row = (C, e) => `${(0.299*(1-C)).toFixed(4)} ${(0.587*(1-C)).toFixed(4)} ${(0.114*(1-C)).toFixed(4)} 0 ${e.toFixed(4)}`;
    m.setAttribute('values', [row(c.r, c.r), row(c.g, c.g), row(c.b, c.b), '0 0 0 1 0'].join('  '));
    f.appendChild(m);
    svg.appendChild(f);
  });
})();
const PaperMarks = (() => {
  const MARKS = [   // 标准位置（2026-09-01 frame_layout 定案）＋归属区域 flag ＋情感 bind
    { src:'frame04_icecrunch.png', x:697, y:740, w:71,  h:70,  bind:'icecrunch', flag:'p3_01_glacier'  },

    { src:'frame05_reed.png',      x:954, y:687, w:136, h:56,  bind:'reed',      flag:'p3_02_lake'     },
    { src:'frame02_rotleaves.png', x:175, y:760, w:142, h:44,  bind:'rotleaves', flag:'p3_02_deadwood' },
    { src:'frame02_snap.png',      x:337, y:607, w:29,  h:70,  bind:'snap',      flag:'p3_02_deadwood' }

    return d;
  });
  function refresh() {
    MARKS.forEach((m, i) => {
      /* 显隐跟着纸面走（2026-09-05 用户定案）：当前 bg 为纸（paperXX）即显示，
         与场景/段落无关——R2 不切 bg，四区域已探索 → 7 标记照常显示，后续 fx 在其上做效果；
         区域场景（bgXX）自然隐藏；切纸/切离由 switchBg 钩子同步 */
      const show = /^paper/.test(bgLatest || '') && flags[m.flag];

      if (show) {                       // 悬停情感色：bind 的情感一经 TAG 即定（R3 作诗同源读取）

      }

  return { refresh };
})();

const ItemSys = (() => {
  const ALPHA = 14;             // 0~255 命中阈值
  const cache = {};             // url -> ImageData | null
  const els = {};               // url -> <img>
  const active = new Set();     // 当前激活物件（+/- 驱动）
  const order = [];             // 视觉 z 序（底→顶）＝加入顺序；_snow 附着到对应大物象紧上
  let tainted = false;          // canvas 被跨源污染（file:// Chromium）→ alphaAt 恒 0，hit() 走矩形兜底

  /* 目录分流：item 体系（itemXX_XX.png）→ art/item/；paper 体系（lake/mountain/lake01/...）→ art/paper/ */
  function dirOf(url) { return /^item\d/.test(url) ? 'art/item/' : 'art/paper/'; }

  function imgEl(url) {
    if (!els[url]) {
      const im = document.createElement('img');
      im.className = 'item-img';
      im.src = dirOf(url) + url;
      document.getElementById('items').appendChild(im);
      els[url] = im;
    }
    return els[url];
  }

  function dataOf(url) {        // 预热并返回 alpha 数据；无 canvas 环境恒 null（无头安全）
    if (cache[url] !== undefined) return cache[url] || null;
    cache[url] = null;
    try {
      const im = new Image();
      im.onload = () => {
        try {
          const c = document.createElement('canvas');
          const cx = c.getContext && c.getContext('2d');
          if (!cx) return;
          c.width = 1920; c.height = 1080;
          cx.drawImage(im, 0, 0, 1920, 1080);
          cache[url] = cx.getImageData(0, 0, 1920, 1080);
        } catch (e) { tainted = true; }    // file:// 跨源污染 canvas（Chromium）：getImageData 抛 SecurityError
      };
      im.src = dirOf(url) + url;
    } catch (e) { tainted = true; }
    return null;
  }

  function alphaAt(url, x, y) {
    const d = dataOf(url);
    if (!d || x < 0 || y < 0 || x >= 1920 || y >= 1080) return 0;
    return d.data[(Math.floor(y) * 1920 + Math.floor(x)) * 4 + 3];
  }

  function add(url, dur) {
    if (active.has(url)) return;   // 已激活：幂等跳过（marked 重复标注防重渐入闪烁）
    active.add(url);
    const im = imgEl(url);
    /* _snow 附着层（paper 体系）：叠到对应大物象紧上（z 不变），不进入命中统计（clickables 只含热点绑定项） */
    const m = url.match(/^(.+)_snow\.png$/);
    if (m && order.includes(m[1] + '.png')) {
      const base = m[1] + '.png';
      const baseEl = els[base];
      if (baseEl && baseEl.parentNode) {
        if (baseEl.nextSibling) baseEl.parentNode.insertBefore(im, baseEl.nextSibling);
        else baseEl.parentNode.appendChild(im);
      }
      order.splice(order.indexOf(base) + 1, 0, url);
    } else if (!order.includes(url)) {
      order.push(url);
    }
    fadeIn(im, dur);
    dataOf(url);
  }
  function remove(url, dur) {
    active.delete(url);
    const i = order.indexOf(url);
    if (i >= 0) order.splice(i, 1);
    fadeOut(els[url], dur);
  }

  /* 可点击物件 = 已激活 + 绑定了当前场景激活热点的（场景匹配 / open / 非段落中 / when）
   * 输出按视觉 z 序（order 底→顶）排列 → hit() 从末尾（最上层）遍历，重叠晕染区命中上层 */
  function clickables() {
    const out = [];
    const sc = SCENES[state.scene];
    if (!sc) return out;
    sc.hotspots.forEach(h => {
      if (!h.item || !active.has(h.item)) return;
      if (state.seg) return;
      if (sc.open && !sc.open()) return;
      if (h.when && !h.when()) return;
      if (h.frame) return;                                  // 方框热点：判定走矩形（hit 内优先），不进 alpha 队列
      out.push({ url: h.item, id: h.id, glow: h.glow });   // glow 配置透传给悬停外发光（setHover）
    });
    out.sort((a, b) => order.indexOf(a.url) - order.indexOf(b.url));
    return out;
  }

  function stageXY(e) {         // 屏幕坐标 → 舞台 1920×1080 坐标（兼容方案A缩放）
    const r = el.stage.getBoundingClientRect();
    if (!r || !r.width) return null;
    const s = r.width / 1920;
    return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s };
  }

  function overUI(e) {          // 命中判定跳过 UI 元素（文本栏/头像/menu 按键/圆环热点）
    const t = e.target;
    return !!(t && t.closest && t.closest('#textbox, #avatar, .menu-btn, #menu, .hotspot'));
  }

  function hit(x, y) {
    /* 1) 方框热点优先：矩形命中（框内即中），有 frame 的物象不走 alpha；
       无 item 的方框热点（残苇：物象画在 bg 景中、无独立物件层）只按 when() 判定 */
    const sc = SCENES[state.scene];
    if (sc && !state.seg && (!sc.open || sc.open())) {
      for (const h of sc.hotspots) {
        if (!h.frame) continue;
        if (h.item && !active.has(h.item)) continue;
        if (h.when && !h.when()) continue;               // 已交互 → 灰态不可点
        const f = h.frame;
        if (x >= f.x && x <= f.x + f.w && y >= f.y && y <= f.y + f.h)
          return { url: h.item, id: h.id, glow: h.glow };   // 与 alpha 命中同构：glow/lit 照常（url 可 undefined=无柔光）
      }
    }
    /* 2) alpha 命中（无方框的物象照旧） */
    const items = clickables();
    for (let i = items.length - 1; i >= 0; i--) {
      if (alphaAt(items[i].url, x, y) > ALPHA) return items[i];
    }
    /* 3) 矩形兜底（2026-08-30）：file:// 下 Chromium 把本地图片视为跨源 → canvas 污染、
       alphaAt 恒 0（叠加层全部不可点）。污染时按视觉 z 序从顶往下，点落在热点 div 矩形内
       即命中——矩形=原圆环热点的交互区坐标（div 虽 display:none，style 几何仍在）。
       正常环境（HTTP / Firefox）不触发，alpha 精确命中不受影响 */
    if (tainted) {
      for (let i = items.length - 1; i >= 0; i--) {
        const elh = document.getElementById('hs_' + items[i].id);
        if (!elh || !elh.style) continue;
        const L = parseFloat(elh.style.left),  T = parseFloat(elh.style.top);
        const W = parseFloat(elh.style.width), H = parseFloat(elh.style.height);
        if (isNaN(L) || isNaN(T) || isNaN(W) || isNaN(H)) continue;
        if (x >= L && x <= L + W && y >= T && y <= T + H) return items[i];
      }
    }
    return null;
  }

  /* 悬停柔光外发光配色表：热点数据 glow:{color, opacity} 单独覆盖
     color: 'white'=纯白剪影柔光 / 'black'=黑色剪影暗晕 / 缺省=物件原色亮化柔光
     opacity: 0~5，缺省 1.0（0 即关闭外发光；>1 过曝增强，仅 white 柔光有意义） */
  const GLOW_COLOR = {
    white: { filter: 'blur(22px) brightness(0) invert(1)', blend: 'screen' },
    black: { filter: 'blur(22px) brightness(0)',           blend: 'normal' }
  };

  function setHover(h) {
    const k = h ? h.url + '#' + h.id : null;
    if (k === hoverKey) return;
    hoverKey = k;
    try { el.stage.style.cursor = h ? 'var(--c-point)' : ''; } catch (e) {}
    /* 悬停柔光：物件同图模糊复制，垫在 item 之下（bg 上、item 下），形状=物件 alpha 轮廓
       本体效果（.lit 亮度提升+去饱和）全局统一；外发光颜色/透明度按热点 glow 配置 */
    try {
      if (!glowEl) {
        glowEl = document.createElement('img');
        glowEl.className = 'item-glow';
        document.getElementById('item-glow').appendChild(glowEl);
      }
      if (h && h.url) {
        glowEl.src = dirOf(h.url) + h.url;
        const g = (h.glow && typeof h.glow === 'object') ? h.glow : {};
        const c = GLOW_COLOR[g.color];
        glowEl.style.filter = c ? c.filter : '';            // 无配置 → CSS 默认（原色柔光）
        glowEl.style.mixBlendMode = c ? c.blend : '';
        const op = (typeof g.opacity === 'number') ? Math.max(0, Math.min(5, g.opacity)) : 1.0;   // 0~5（>1 允许过曝增强）
        glowEl.style.opacity = String(op);
      } else {
        glowEl.style.opacity = '0';    // 无物件层的热点（url undefined）→ 无柔光，仅方框悬停提亮
      }
      Object.values(els).forEach(im => {
        im.classList.toggle('lit', !!h && typeof im.src === 'string' && im.src.endsWith('/' + h.url));
      });
      /* 方框悬停态：命中（方框或 alpha 同一条路）→ 暗红；离开 → 还原 */
      try {
        document.querySelectorAll('.frame.hover').forEach(fd => fd.classList.remove('hover'));
        if (h) { const fd = document.getElementById('frame_' + h.id); if (fd) fd.classList.add('hover'); }
      } catch (e) { /* 无头环境无 querySelectorAll */ }
    } catch (e) { /* 无头环境 */ }
    /* 悬停音效钩子（预留）：h && playHoverSfx() */
  }
  let hoverKey = null, glowEl = null;

  if (el.stage && el.stage.addEventListener) {
    el.stage.addEventListener('mousemove', e => {
      if (FxSnow.playing) { setHover(null); return; }   // fx 播放中：吞悬停
      if (overUI(e)) { setHover(null); return; }
      const p = stageXY(e);
      setHover(p ? hit(p.x, p.y) : null);
    });
    el.stage.addEventListener('mouseleave', () => setHover(null));
    el.stage.addEventListener('click', e => {
      if (FxSnow.playing) return;                      // fx 播放中：吞点击（一次性演出）
      if (overUI(e)) return;
      const p = stageXY(e);
      const h = p && hit(p.x, p.y);
      if (!h) return;
      const elh = document.getElementById('hs_' + h.id);
      if (elh && elh.click) elh.click();        // 与圆环 UI 同一条行为路径
    });
  }

  function clear() { [...active].forEach(u => remove(u, 0)); }   // 开发跳转用：清空全部物件层
  return { add, remove, clear };
})();

/* ============ 调色罩层（tintXX.png，#[+tintXX] / #[-tintXX] 加减驱动，粘性可多层） ============
 * 透明底 1920×1080 PNG，铺在 item 层之上（z5：bg→item 之上、热点/文本栏之下）；
 * 用途：纸纹/环境罩染等，把 item 压回环境里（"分离背景中的纹理挪到最上层"）。
 * 无点击、无命中——纯视觉层。 */
const TintSys = (() => {
  const els = {};
  const active = new Set();
  function imgEl(url) {
    if (!els[url]) {
      const im = document.createElement('img');
      im.className = 'tint-img';
      /* 路径分流（2026-08-30）：paper_tint 等纸张系罩层存放在 art/paper/，
         与纸张图层体系同目录（PAPER_LIST 记档）；其余罩层走 art/tint/ */
      im.src = (/^paper/.test(url) ? 'art/paper/' : 'art/tint/') + url;
      const host = document.getElementById('tints');
      if (host && host.appendChild) host.appendChild(im);
      els[url] = im;
    }
    return els[url];
  }
  function add(url, dur)    { if (active.has(url)) return; active.add(url); fadeIn(imgEl(url), dur); }  // 幂等：重复标注防闪
  function remove(url, dur) { active.delete(url); fadeOut(els[url], dur); }
  function clear(dur)      { [...active].forEach(u => remove(u, dur)); }   // 开发跳转/R2→R3 过渡用：清空全部罩层（dur=淡出时长）
  return { add, remove, clear };
})();
Object.values(SCENES).forEach(sc => {
  sc.hotspots.forEach(h => {
    const elh = document.getElementById('hs_' + h.id);
    if (!elh) return;
    elh.addEventListener('click', () => {
      if (state.scene === null || SCENES[state.scene] !== sc) return;   // 只响应当前场景的热点
      const seg = sc.segments.find(s =>
        s.trigger === 'hotspot:' + h.id && !s.done && (!s.cond || s.cond()));
      /* repeat：常驻差分热点（远帐灯/星影）——同 trigger 多段按数组序=优先级，
         每次点击重评条件取首个匹配，不置 done，可反复触发 */
      if (seg) { if (!seg.repeat) seg.done = true; fireSegment(seg); }
    });
  });
});

      flags:Object.assign({ p3_01_glacier:true, p3_02_deadwood:true, p3_01_mountain:true, p3_02_lake:true }, R1_FLAGS),
      nodes:[ ...BASE_R1(), ITEM('+','river_snow.png'), ITEM('+','wood_snow.png'),
              ITEM('+','mountain_snow.png'), ITEM('+','lake_snow.png'), ITEM('+','tent_snow.png') ] },
    { id:'r2_blizzard', label:'R2 · 暴雪走马灯（手动播放）', scene:'blizzard',
      flags:Object.assign({ p3_01_glacier:true, p3_02_deadwood:true, p3_01_mountain:true, p3_02_lake:true,
                            evt_p3_blizzard:true }, R1_FLAGS),
      nodes:[ ...BASE_R1(), ITEM('+','river_snow.png'), ITEM('+','wood_snow.png'),
              ITEM('+','mountain_snow.png'), ITEM('+','lake_snow.png'), ITEM('+','tent_snow.png') ] },
    { id:'r2_snowfx', label:'R2→R3 · 过渡演出（R2 收栏后直转 R3 画布）', scene:'blizzard',
      flags:Object.assign({ p3_01_glacier:true, p3_02_deadwood:true, p3_01_mountain:true, p3_02_lake:true,
                            evt_p3_blizzard:true, evt_p3_r2_end:true }, R1_FLAGS),
      nodes:[ ...BASE_R1(), ITEM('+','river_snow.png'), ITEM('+','wood_snow.png'),
              ITEM('+','mountain_snow.png'), ITEM('+','lake_snow.png'), ITEM('+','tent_snow.png') ],
      then:null,

    { id:'r3', label:'R3 · 作诗画布（直接浮现）', scene:'blizzard',
      flags:Object.assign({ p3_01_glacier:true, p3_02_deadwood:true, p3_01_mountain:true, p3_02_lake:true,
                            evt_p3_blizzard:true, evt_p3_r2_end:true, evt_r2_snowfx:true }, R1_FLAGS),
      nodes:[], then:null,
      enter:() => { try { R3Canvas.enter(); } catch (e) {} } },
    /* 进区域段（then=进场媒体收栏后直接开对应大物象段）：fresh 状态 → 冻湖走"进场 A"文案；
       想看"进场 B（已探索其他区域）"，先跳 r1_glacier 等完成态目标再点地图 */
    /* 枯木林区域（区域机制）：近景（枯枝/腐叶小物象）与深景（大物象段） */
    { id:'r1_in_wood_region', label:'枯木林 · 区域近景（枯枝/腐叶小物象）', scene:'deadwood_region',
      flags:{},
      nodes:[ BG('bg13.png'), TINT('+','tint06.png'),
              ITEM('+','item08_01.png'), ITEM('+','item09_01.png') ] },
    { id:'r1_in_deadwood', label:'枯木林 · 区域深景（进大物象段）', scene:'deadwood_region',
      flags:{ p3_02_snap:true, p3_02_rotleaves:true },
      nodes:[ BG('bg14.png'),
              ITEM('+','item08_02.png'), ITEM('+','item09_02.png') ], then:'p3_02_deadwood' },

    { id:'r1_in_mountain_region', label:'山 · 区域近景（石碑小物象）', scene:'mountain_region',
      flags:{},
      nodes:[ BG('bg16.png'), TINT('+','tint08.png'), ITEM('+','item12_01.png') ] },
    { id:'r1_in_mountain', label:'山 · 区域深景（进大物象段）', scene:'mountain_region',
      flags:{ p3_03_stones:true },
      nodes:[ BG('bg17.png'),
              ITEM('+','item12_02.png') ], then:'p3_01_mountain' },
    /* 冰河区域（区域机制）：近景（马蹄印/冰碴小物象）与深景（大物象段） */
    { id:'r1_in_glacier_region', label:'冰河 · 区域近景（马蹄印/冰碴小物象）', scene:'glacier_region',
      flags:{},
      nodes:[ BG('bg23.png'), TINT('+','tint11.png'),
              ITEM('+','item15_01.png'), ITEM('+','item16_01.png') ] },
    { id:'r1_in_glacier', label:'冰河 · 区域深景（进大物象段）', scene:'glacier_region',
      flags:{ p3_01_hoofprint:true, p3_01_icecrunch:true },
      nodes:[ BG('bg23.png'),          // bg24 待美术（缺图保护：保持上一张 bg）
              ITEM('+','item15_02.png'), ITEM('+','item16_02.png') ], then:'p3_01_glacier' },
    /* 冻湖区域（区域机制）：近景（残苇小物象）与深景（大物象段） */
    { id:'r1_in_lake_region', label:'冻湖 · 区域近景（残苇小物象）', scene:'lake_region',
      flags:{},
      nodes:[ BG('bg29.png') ] },
    { id:'r1_in_lake', label:'冻湖 · 区域深景（进大物象段）', scene:'lake_region',
      flags:{ p3_03_reed:true },
      nodes:[ BG('bg29.png') ], then:'p3_02_lake' },
  ];

  function to(id) {
    const t = TARGETS.find(x => x.id === id);
    if (!t) return;
    state.seg = null;
    try { closeTextbox(); el.lines.innerHTML = ''; } catch (e) {}
    Object.keys(flags).forEach(k => delete flags[k]);        // 不关联历史数据：全清重建
    Object.keys(counters).forEach(k => delete counters[k]);
    Object.keys(emotions).forEach(k => delete emotions[k]);
    Object.values(SCENES).forEach(sc => sc.segments.forEach(s => { s.done = false; }));
    ItemSys.clear(); TintSys.clear(); FxSnow.clear();   // 雪面复位（防上个预览态的 fx 残留）
    Object.assign(flags, t.flags);
    if (t.enter) { t.enter(); return; }                       // 特殊目标（如 R3 画布）：直接浮现，不进段
    state.devHold = true;                                    // 切换瞬间抑制 auto（收栏后恢复）
    enterScene(t.scene);
    state.devHold = false;
    /* 进场媒体段收栏后接续：then=直接开指定段（区域交互预览）；after=收栏后自定义（R2→R3 过渡预览） */
    const then = t.then ? () => {
      const seg = SCENES[t.scene].segments.find(s => s.id === t.then);
      if (seg) fireSegment(seg);

    fireSegment({ id:'dev_jump_' + id, trigger:'auto', nodes: t.nodes.slice(), onEnd: then });

  /* ---------- UI：左上角折叠面板 ----------

     面板构建保留但 display:none，调试时在控制台执行 __DevJumpShow() 唤出） ---------- */
  let panelEl = null, listEl = null, open = false;
  function buildUI() {
    if (!document.body || !document.body.appendChild) return;
    panelEl = document.createElement('div');
    panelEl.style.cssText = 'position:fixed; left:8px; top:8px; z-index:999; font:12px/1.5 sans-serif;' +
      'background:rgba(10,10,12,.82); color:#cfcfcf; border:1px solid #5a5a5a; border-radius:4px; padding:6px; width:250px; display:none;';
    const head = document.createElement('div');
    head.textContent = '▸ 预览跳转（` 键）';
    head.style.cssText = 'cursor:pointer; user-select:none; color:#c9b896; font-weight:bold;';

        'border:1px solid #4a4a4a; border-radius:3px;';
      b.addEventListener('mouseenter', () => b.style.background = '#33333a');
      b.addEventListener('mouseleave', () => b.style.background = '#1c1c20');
      b.addEventListener('click', () => to(t.id));
      listEl.appendChild(b);
    });
    panelEl.appendChild(head); panelEl.appendChild(listEl);
    document.body.appendChild(panelEl);
  }
  function toggle() { open = !open; if (listEl) listEl.style.display = open ? 'block' : 'none'; }
  try { buildUI(); } catch (e) { /* 无头环境 */ }
  // 调试出口（控制台）：__DevJumpShow() 显示面板；URL ?debug=1 也自动显示
  try {
    if (/[?&]debug=1/.test(location.search)) { panelEl.style.display = 'block'; }
  } catch (e) {}
  globalThis.__DevJumpShow = () => { if (panelEl) panelEl.style.display = 'block'; };
  if (window.addEventListener) {
    window.addEventListener('keydown', e => {
      if (e.key === '`') toggle();
      else if (e.key === 'Escape' && open) toggle();
    });
  }

  return { to };
})();

/* ============ 滚轮查看历史 ============ */
document.getElementById('text-layer').addEventListener('wheel', (e) => {
  if (state.shownLineCount < 2) return;
  e.preventDefault();
  const autoT = 860 - contentBottom();
  const step = 28;
  if (e.deltaY < 0) state.curT = toward(state.curT, 108, step);
  else              state.curT = toward(state.curT, autoT, step);
  state.followBottom = false;
  layout();
}, { passive:false });

/* ============ 启动 ============ */
/* URL 直达：demo_current.html#jump=camp → 跳过 Phase 0 直接进目标预览态 */
const __devJump = (() => {
  try { return /jump=([\w]+)/.exec(typeof location !== 'undefined' ? (location.hash || '') : ''); }
  catch (e) { return null; }
})();
/* ============ 开场封面交互（2026-09-06）============
   点击 #start-veil → 播一遍 draw_blade.mp3（拔刀音）+ 整层 2s 渐黑 → 第 5 秒：撤销 pre-start + 启动 Phase 0。
   pre-start 期间 body 隐藏 #menu / #menu-collapse / #textbox（避免 title 还在时露底）。
   无头环境（sim）：无封面流程，直接开 Phase 0。 */
function bindStartVeil(){
  if (window.__HEADLESS) { fireSegment(p0seg); return; }   // sim 无头：跳过封面直开
  const veil = document.getElementById('start-veil');
  if (!veil) { fireSegment(p0seg); return; }   // 无封面：直接开（备份路径）
  let clicked = false;
  veil.addEventListener('click', () => {
    if (clicked) return;
    clicked = true;
    // 拔刀音（点击即播，一次性 SE；点击=用户手势 → autoplay 放行）
    try {
      const sfx = new Audio('sound/draw_blade.mp3');
      sfx.volume = 0.9;
      sfx.play().catch(() => {});
    } catch (e) {}
    veil.classList.add('fading');              // 2s 渐黑（CSS transition）
    // 2s 后（渐黑完成）：移走遮罩 + 触发主 demo
    setTimeout(() => {
      veil.parentNode.removeChild(veil);
      document.body.classList.remove('pre-start');
      document.body.classList.add('started');   // 触发 #menu/#textbox 进场 transition
      fireSegment(p0seg);
    }, 2000);
  }, { passive: true });
}

if (__devJump) setTimeout(() => DevJump.to(__devJump[1]), 60);
// 否则：等开场封面被点击 + 5s 后启动 Phase 0
else bindStartVeil();
