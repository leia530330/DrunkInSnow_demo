<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>醉雪 · Phase 0–3 R1 demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#000; overflow:hidden;
    font-family: "Source Han Serif SC", "Source Han Serif CN", "思源宋体",
                 "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif; }

  /* ---------- 舞台：基准 1920×1080，等比缩放 ---------- */
  #stage {
    position: fixed; left:50%; top:50%;
    width:1920px; height:1080px;
    transform-origin: center center;
    transform: translate(-50%,-50%) scale(var(--s,1));
    overflow: hidden;
  }

  /* ---------- 背景层（全幅垫底；初始无图，由 #[bgXX.png] 标注驱动） ---------- */
  #bg {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    z-index:0;
  }
  /* Phase 0 纯黑垫底层（2026-09-06 用户指令）：叠在 #bg 之下；进出与 Phase 1 完全同步
     （开启=进入 Phase 0；关闭=进入 Phase 1 营地时淡出与 bg01 同步） */
  #phase0-base {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    background: url("art/background/phase0_base.png") 0 0 / 1920px 1080px no-repeat #000;
    z-index:-1;
    opacity:0; transition: opacity .6s ease;
  }
  #phase0-base.visible { opacity:1; }
  /* bg 交叉淡化层：新 bg 淡入覆盖旧 bg，结束后回落为 #bg */
  .bg-fade {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    background-position:center; background-size:cover; background-repeat:no-repeat;
    opacity:0; transition:opacity .6s ease;
    z-index:1; pointer-events:none;
  }
  .bg-fade.show { opacity:1; }

  /* ---------- 开场封面（2026-09-06 用户定案）：title.png 极简版，取代旧 start_screen.html ----------
     - title.png 已扩为 1920×1080（原 1820×1080 左右各加 50px 透明边，居中）
     - 封面双层：title_base.png（1920×1080 底色，垫底）+ title.png（其上）——进出完全同步
     - 封面层在 #stage 内（1920×1080 舞台坐标系，随舞台等比缩放），水平垂直居中 = 0 0 铺满
     - 点击任意位置 → 播一遍 draw_blade.mp3 + 整层 2s 渐黑（淡出）
     - 第 5 秒：#menu 小方块从左滑入 + #textbox 从上落下 + 启动 Phase 0 主对话 */
  #start-veil {
    position: absolute; left:0; top:0; width:1920px; height:1080px;
    background: url("art/title/title.png")       0 0 / 1920px 1080px no-repeat,
                url("art/title/title_base.png") 0 0 / 1920px 1080px no-repeat #000;
    z-index: 999;
    cursor: pointer;
    transition: opacity 2s ease;
  }
  #start-veil.fading { opacity:0; pointer-events:none; }
  /* 启动前隐藏主 demo 关键 UI（避免 title 还在时露底） */
  body.pre-start #menu,
  body.pre-start #menu-collapse,
  body.pre-start #textbox { opacity:0; transform: translate(0,0); }
  /* 进场动画（pre-start 类名被移除后触发）
     ── 2026-09-06 19:55 修正：!important 落在 #textbox 基础规则上，会压过
        #textbox.open（特异性再高也敌不过 !important）→ 所有 textbox 被隐藏。
        正确做法：进场起点也用 body 级规则（pre-start 期间移出 + transition），
        pre-start 移除时元素从移出位过渡到引擎当前状态（.open?0:-100%），
        引擎 .open 开关全程保持权威。 */
  #menu {
    transform: translateX(-120px);
    transition: transform .55s cubic-bezier(.22,.7,.31,1);
  }
  body.started #menu { transform: translateX(0); }
  #textbox { transition: transform .65s cubic-bezier(.22,.7,.31,1) .15s; }
  /* 开场瞬间（pre-start 尚在）：textbox 移出到 -1100px（进场起点） */
  body.pre-start #textbox { transform: translateY(-1100px); }
  /* pre-start 移除 + .open：从 -1100 落到 0（进场动画）；
     其后引擎 .open 开关正常接管（无 !important，不再锁死） */
  body.started #textbox.open { transform: translateY(0); }
  /* 兼容：让 #menu 的 transition 完整生效（transition 存在但 transform 需从 translateX(-120) 起步，否则瞬移） */
  #menu, #textbox { will-change: transform; }

  /* ---------- 物件层（itemXX.png，透明底 1920×1080 与 bg 对齐；alpha 命中） ---------- */
  #items {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    z-index:4; pointer-events:none;
  }
  .item-img {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    display:none; pointer-events:none;
    transition: opacity .5s ease, filter .18s ease;   /* 渐显渐隐 + 悬停提亮过渡 */
  }
  /* 悬停效果（2026-08-28 定案）：本体=默认统一（亮度提升+轻微去饱和）泛白；
     外发光=默认物件原色柔光，透明度 1.0/颜色可按热点 glow 配置单独覆盖
     （见 setHover 内 GLOW_COLOR：color:'white'|'black'，opacity:0~5 缺省 1.0） */
  .item-img.lit { filter: brightness(1.3) saturate(0.6); }   /* 默认悬停：亮度提升 + 轻微去饱和（泛白） */

  /* ---------- 物件柔光层：bg 之上(z1 bg-fade)、item(z4) 之下(z3) ----------
     默认：物件同图模糊亮化复制（原色 screen 柔光），opacity 由内联样式驱动（热点 glow 配置） */
  #item-glow {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    z-index:3; pointer-events:none;
  }
  .item-glow {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    opacity:0;
    filter: blur(22px) brightness(1.9) saturate(1.3);
    mix-blend-mode: screen;
    transition: opacity .22s ease;
  }

  /* ---------- 调色/罩染层（tint）：item(z4) 之上、热点(z6) 之下(z5) ----------
     纸纹等环境罩层，盖住 bg+item 使物件融入环境；#[±tintXX.png] 增减驱动，粘性可多层 */
  #tints {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    z-index:5; pointer-events:none;
  }
  .tint-img {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    display:none; pointer-events:none;
    transition: opacity .6s ease;   /* 渐显渐隐（与 bg 交叉淡化同步长） */
  }

  /* ---------- 方框标注层（frame）：tint(z5)/hotspots(z6) 之上(z7)，提示可交互物象 ----------
     每框独立 PNG（art/frame/frame01_{id}.png，从源图按 bbox 切出）——图片本身就是方框，
     100% 填充背景，无精灵图/偏移。源图含黑底+白斑点做旧+篆书（2026-08-29 晚定图）。
     悬停=filter 提亮，已交互=消失（updateFrames 隐藏）。
     ⚠ 不用 CSS mask：部分 Chromium 下 PNG 遮罩整块渲染为全透明（2026-08-29 实测） */
  #frames {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    z-index:7; pointer-events:none;
  }
  .frame {
    position:absolute; pointer-events:none;
    background-image: var(--f-img);
    background-size: 100% 100%;            /* 图片本身即方框，填满 div */
    background-repeat: no-repeat;
    transition: filter .18s ease;          /* 悬停提亮过渡 */
  }
  .frame.hover { filter: brightness(1.4) saturate(1.15); }   /* 悬停=整体提亮 */


  /* ---------- 热点层（调色层之上、文本栏之下） ---------- */
  /* 自定义指针（2026-08-28）：源图 320×320 已降采样到 32×32（DPR 缩放由浏览器/OS 自动处理——
     150% 缩放下约 48×48 物理像素）。
     2026-08-29：黑款（cursor_01）在暗景中不显眼 → idle/point 全用红款（cursor_02），
     两个变量保留以便日后分化；热点仍须一致（均=字形中心 17,17），否则跨元素边界切换时贴图平移跳变 */
  :root {
    --c-idle: url("art/cursor/cursor_02_32.png") 17 17, auto;
    --c-point: url("art/cursor/cursor_02_32.png") 17 17, pointer;
  }
  html, body, #stage { cursor: var(--c-idle); }                  /* 默认/背景/item 区域 = idle 光标 */
  .hotspot, .choice .opt, #advance-btn { cursor: var(--c-point); }   /* 交互处 = point 光标 */

  /* ---------- 纸张小物象标记层（PaperMarks）：R1 纸地图最上层（z8）----------
     标准位置=frame_layout 排布定案 JSON；初始隐藏，遍历对应大物象区域后显现；
     悬停 → 黑色线条染为该物象所记录情感（emotions[bind]）对应色，并微微发光
     （亮度提升+情感色光晕，对齐主菜单/区域方框悬停语言）——SVG feColorMatrix 亮度映射
     （黑→情感色、白部保持、alpha 保留；file:// canvas 污染不可用故不走 canvas 重染）；
     纯回望提示无点击行为 */
  #paper-marks {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    z-index:8; pointer-events:none;
  }
  #paper-marks .mark {
    position:absolute; pointer-events:auto;
    background-repeat:no-repeat; background-size:100% 100%;
    transition: filter .15s ease;
  }
  /* 悬停 = 情感染色（只染黑线，白部保持）+ 微光（亮度提升 + 情感色光晕）——
     强调语言对齐主菜单/区域方框的悬停高亮（微微发光，非整体换色）。
     滤镜链整体由 JS 按 EMO_COLOR 生成并内联到元素的 --pm-hover 变量：
     改情感色/微光强度只改 JS 里 EMO_COLOR / PM_GLOW 两处配置，CSS 无需动 */
  #paper-marks .mark:hover { filter: var(--pm-hover, none); }

  /* R2 飞雪 fx 已删除（2026-09-06 用户定案）——#fx-snow / #fx-snow-fly DOM 与 CSS 一并移除 */

  #hotspots {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    z-index:6; pointer-events:none;
  }
  .hotspot {
    position:absolute; pointer-events:auto;
    border:2px solid rgba(201,184,150,0.7);
    border-radius:50%;
    background: radial-gradient(circle, rgba(201,184,150,0.12), rgba(201,184,150,0.02) 70%);
    display:none;
    animation: hsPulse 2.2s ease-in-out infinite;
    transition: box-shadow .25s ease, border-color .25s ease, transform .25s ease;
  }
  /* 悬停：停止脉冲，按热区形状叠一层稳定柔光（内晕+双层外晕+填充提亮，确保暗背景上可见） */
  .hotspot:hover {
    animation: none;
    border-color: rgba(243,232,200,1);
    background: radial-gradient(circle, rgba(238,226,192,0.42), rgba(238,226,192,0.12) 72%);
    box-shadow:
      inset 0 0 60px rgba(238,226,192,0.60),
      0 0 16px rgba(238,226,192,0.90),
      0 0 56px rgba(220,203,164,0.65);
    transform: scale(1.03);
  }
  .hotspot:hover .hs-label { color:#f0e6d2; }
  .hotspot .hs-label {
    position:absolute; left:50%; top:-26px; transform:translateX(-50%);
    color:#c9b896; font-size:16px; white-space:nowrap; text-shadow:0 1px 4px #000;
    transition: color .25s ease;
  }
  @keyframes hsPulse {
    0%,100% { box-shadow:0 0 0 0 rgba(201,184,150,0.40); }
    50%     { box-shadow:0 0 0 14px rgba(201,184,150,0); }
  }

  /* ---------- 文本栏外壳（右 500×1080，开场向下平移展开） ---------- */
  #textbox {
    position:absolute; left:1400px; top:0; width:500px; height:1080px;
    transform: translateY(-100%);
    transition: transform .25s ease;
    z-index:10;
  }
  #textbox.open { transform: translateY(0); }
  /* 开场进场动画覆盖（见上方 body.started 段）：
     进场时 #textbox 被 !important 移出 → .open 引擎开栏时 body.started #textbox.open 接管为 0；
     closeTextbox 移除 .open → 回落 translateY(-1100px)!important（收起）✔ */

  #textbox-bg {
    position:absolute; left:0; top:0; width:500px; height:1080px;
    background: url("art/textbox/textbox_bg.png") center/cover no-repeat;
  }

  /* 文本层：左端 x:1470 → 相对文本栏 left:70；宽 392；高 860 = 滚动裁切线 */
  #text-layer {
    position:absolute; left:70px; top:0; width:392px; height:860px;
    overflow:hidden;
  }
  #lines {
    position:absolute; left:0; top:0; width:392px;
    will-change: transform;
  }
  .line {
    width:392px;
    font-size:20px; line-height:1.4;
    color:#9a9a9a;                 /* 旧行：浅灰 */
    margin-bottom:16px;            /* [] 段间距 */
    word-break: break-word;
  }
  .line .sp { font-weight:500; opacity:.55; }   /* 旧行讲话者：黯淡 */
  .line.latest { color:#ffffff; }               /* 末行：白 */
  .line.latest .sp { opacity:1; }               /* 末行讲话者：鲜亮 */
  .line.emo-tag { font-size:16px; margin-bottom:12px; }  /* 情感标签行：略小、间距略紧（字色由 JS 按情感内联） */

  /* 诗句引用块：整段左侧浅灰竖线 + 缩进一格，内部换行无段间距 */
  .line.quote {
    border-left: 2px solid #8a8a8a;
    padding-left: 1em;
  }

  /* 讲话者颜色 */
  .sp.sp01 { color:#9b6800; }
  .sp.sp02 { color:#003f61; }
  .sp.sp03 { color:#9b7dc1; }
  .sp.spl  { color:#d0d0d0; }   /* 玩家声线"你 -"：中性亮灰 */

  /* 选项 */
  .choice { margin:0 0 16px; }
  .choice .opt {
    font-size:20px; line-height:1.4; color:#cfcfcf;
    margin-bottom:8px;
  }
  .choice .opt:hover { color:#ffffff; }

  /* 顶部遮挡层（统一尺寸 500×1080；有效区顶部 y:0~108） */
  #textbox-top {
    position:absolute; left:0; top:0; width:500px; height:1080px;
    background: url("art/textbox/textbox_top.png") top left/500px 1080px no-repeat;
    z-index:12; pointer-events:none;
  }

  /* 继续 / 结束按钮（烧字图 245×62；相对 left:217px） */
  #advance-btn {
    position:absolute; left:217px; top:910px; width:245px; height:62px;
    background: url("art/textbox/button_continue.png") center/245px 62px no-repeat;
    border:none; z-index:13;
    text-indent:-9999px;
  }
  #advance-btn:hover { filter: brightness(1.1); }
  #advance-btn.end { background-image: url("art/textbox/button_end.png"); }

  /* ---------- 头像框（左缘 x:1202，255×340，2026-08-24 右移 20px） ---------- */
  #avatar {
    position:absolute; left:1202px; top:120px; width:255px; height:340px;
    background: url("art/avatar/character_02.png") center/255px 340px no-repeat;
    z-index:20;
    display:none;
  }

  /* ---------- menu 按键组（方案A：左缘竖列，最上层贯穿全程） ----------
     #menu 主键常驻 (0,860)；点击展开四个功能键 + 收起小键（向上弹出，自下而上错峰）：
     语言 (0,440) / 音频 (0,580) / 画面 (0,720) / 返回主页 (0,860)（原主键位），间隔 40px；
     收起键=向下三角 (0,360, 40×40)，点击整组向下收回淡出、主键复原。
     功能键图待美术（menu_lang/audio/screen/home_CH.png，280×700 同比例；
     收起三角 menu_collapse.png 方形）——缺图时按钮隐形但交互骨架就位。
     悬停=提亮，与 frame 方框同款（brightness 1.4 + 轻微饱和）。
     命中缓冲（2026-08-31）：四个功能键的交互识别区在打开状态下右扩 20px（命中宽 60，
     视觉仍 40×100）——贴边点击不致误触 light-dismiss 收起菜单；收起三角不受影响（40×40） */
  .menu-btn {
    position:absolute; left:0; width:60px; height:100px;   /* 命中宽 60=视觉 40+右缓冲 20 */
    background-repeat:no-repeat; background-size:40px 100px;   /* 视觉：图仍占左 40px，缓冲区透明 */
    z-index:50;                     /* menu 组(z50) 在存档黑幕(z40) 之上——存档时仍可见但不可点（.saving） */
    cursor: var(--c-point);
    opacity:0; pointer-events:none; transform: translateY(16px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .menu-btn.open { opacity:1; transform: translateY(0); pointer-events:auto; }
  .menu-btn:hover { filter: brightness(1.4) saturate(1.15); }   /* 悬停提亮，同 frame 方框 */
  #menu-lang   { top:440px; background-image: url("art/menu/menu_lang_CH.png"); }
  #menu-audio  { top:580px; background-image: url("art/menu/menu_audio_CH.png"); }
  #menu-display { top:720px; background-image: url("art/menu/menu_display_CH.png"); }
  #menu-home   { top:860px; background-image: url("art/menu/menu_home_CH.png"); }
  #menu-collapse {                              /* 收起键：向下三角（小键，40×40） */
    top:360px; width:40px; height:40px;
    background-size:40px 40px;
    background-image: url("art/menu/menu_collapse.png");
  }
  /* ---------- 语言选项键（menu_lang 右侧弹出）：CH/EN 两态，点一下换一张 ----------
     位于 menu_lang 右侧 40px 间隙处 (80,440, 40×100)；点击 menu_lang 从左侧隐藏处向右弹出，
     再点收回。图片随语言状态切换（menu_langopt_CH/EN.png，280×700，图待美术）。
     点击切换语言：全部带语言区分的按钮（主键+四功能键+本键）换 _CH/_EN 图；
     文本栏重渲染暂缓（英文文本未备，语言系统接入时补） */
  .menu-opt {
    position:absolute; left:80px; top:440px; width:40px; height:100px;
    background-repeat:no-repeat; background-size:40px 100px;
    z-index:50;                     /* menu 组(z50) 在存档黑幕(z40) 之上 */
    cursor: var(--c-point);
    opacity:0; pointer-events:none; transform: translateX(-40px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .menu-opt.out { opacity:1; transform: translateX(0); pointer-events:auto; }
  .menu-opt:hover { filter: brightness(1.4) saturate(1.15); }

  /* ---------- display 选项键（menu_display 右侧弹出）：一张图上下两框 ----------
     上半=全屏 (menu_dispopt 上框)、下半=窗口 (下框)，各为独立点击区（精灵切半：40×50 各取 bg-position）。
     选中=常态高亮、未选=暗淡（opacity .35+去饱和）；点击上半进全屏、下半回窗口——
     选中态由 fullscreenchange 事件驱动（F 键/ESC/本键同源同步）；图 menu_dispopt_CH/EN.png（280×700，图待美术） */
  #menu-dispopt { top:720px; }
  #menu-dispopt:hover { filter:none; }        /* 悬停提亮交给两个半区，容器不整体提亮 */
  .disp-half {
    position:absolute; left:0; width:40px; height:50px;
    background-repeat:no-repeat; background-size:40px 100px;
    cursor: var(--c-point);
    transition: opacity .18s ease, filter .18s ease;
  }
  #menu-dispopt-full { top:0;    background-position: 0 0; }      /* 上框：全屏 */
  #menu-dispopt-win  { top:50px; background-position: 0 -50px; }  /* 下框：窗口 */
  .disp-half.sel   { opacity:1; }
  .disp-half.unsel { opacity:0.35; filter:saturate(0.6); }        /* 未选：暗淡 */
  .disp-half:hover { filter: brightness(1.4) saturate(1.15); }    /* 悬停提亮（含未选，提示可点） */

  /* ---------- audio 选项（menu_audio 右侧弹出）：双竖向音量滑杆 ----------
     面板 (80,520) 120×160 = 注释行（40×40 音符/鼠标，两滑杆上方 20px）+ 两套滑杆（各 40×100，横向间隔 40px）：
     左=环境音量（音符注释）、右=音效音量（鼠标注释）。滑杆三层：底=背景 / 中=黑色长条（行程轨道，全高贯通）
     / 顶=白色小方块（滑块，随音量上下：顶=100% 底=0%）。拖拽/点按轨道均可调值。
     图（一套共用两杆，图待美术）：menu_audioopt_bg.png（280×700 背景）、menu_audioopt_track.png
     （280×700 黑色长条，建议纵向贯通全高=行程）、menu_audioopt_thumb.png（280×280 白方块居中，显示 40×40）、
     menu_audionote.png / menu_audiomouse.png（280×280 注释，显示 40×40） */
  #menu-audioopt { top:520px; width:120px; height:160px; cursor:default; }
  #menu-audioopt:hover { filter:none; }        /* 容器不整体提亮（滑杆是控件不是按钮） */
  /* 音频注释明暗自适应：画面最左 200px 平均亮度 < 中性灰(128) → 注释反白（.on-dark，invert 纯黑素材）；
     ≥128 保持黑。判定表 BG_LUMA（离线预计算）随 switchBg 钩子更新（见 JS） */
  #menu-audioopt.on-dark .aud-icon { filter: invert(1); }
  .aud-icon {
    position:absolute; top:0; width:40px; height:40px;
    background-repeat:no-repeat; background-size:40px 40px;
    pointer-events:none;
  }
  #menu-audnote  { left:0;   background-image:url("art/menu/menu_audionote.png"); }   /* 音符=环境 */
  #menu-audmouse { left:80px; background-image:url("art/menu/menu_audiomouse.png"); } /* 鼠标=音效 */
  .aud-slider {
    position:absolute; top:60px; width:40px; height:100px;
    cursor: ns-resize;
  }
  #menu-audamb { left:0; }      /* 环境音量（左） */
  #menu-audsfx { left:80px; }   /* 音效音量（右，间隔 40px） */
  .aud-bg, .aud-track {
    position:absolute; left:0; top:0; width:40px; height:100px;
    background-repeat:no-repeat; background-size:40px 100px;
    pointer-events:none;
  }
  .aud-slider .aud-bg    { background-image:url("art/menu/menu_audioopt_bg.png"); }
  .aud-slider .aud-track { background-image:url("art/menu/menu_audioopt_track.png"); }
  .aud-thumb {                                  /* 滑块=全幅图层（白方块画在 280×700 轨道坐标系内，
                                                   默认位于轨道顶=100%），垂直平移实现行程 */
    position:absolute; left:0; top:0; width:40px; height:100px;
    background-repeat:no-repeat; background-size:40px 100px;
    background-image:url("art/menu/menu_audioopt_thumb.png");
    pointer-events:none;                        /* 命中统一走滑杆整区（轨道+滑块都可拖/点） */
  }
  /* ---------- 返回主页确认面板（menu_home 右侧弹出）：一张图三区块 ----------
     1120×700（显示 160×100，÷7）：上部=提示文字（"未储存的进度将会丢失"/"Progress will be lost"）、
     左下=×（返回：整面板向左弹回收起）、右下=√（确认回主页——动作暂不挂载，TODO）。
     三区块平铺整面板（精灵切分，各含自身背景与字样）；×/√ 悬停提亮可点；
     图已到（menu_homeopt_CH/EN.png，选区已按实测校准——见下方注释） */
  #menu-homeopt { left:80px; top:860px; width:160px; height:100px; cursor:default; }
  #menu-homeopt:hover { filter:none; }        /* 容器不整体提亮（区块各自处理） */
  .homeopt-region {
    position:absolute;
    background-repeat:no-repeat;
    background-size:160px 100px;
    background-image: var(--ho-img, url("art/menu/menu_homeopt_CH.png"));
  }
  .homeopt-hit {
    cursor: var(--c-point);
    transition: filter .18s ease;
  }
  .homeopt-hit:hover { filter: brightness(1.4) saturate(1.15); }
  /* 选区（按美术实测校准 2026-08-31）：三区块平铺整面板——
     文字带 src y 53~400 / ×标记 src x356-502 y477-628 / √标记 src x896-1061 y469-633（CH/EN 同位）
     分割线 y440（÷7=63）与 x560（÷7=80）：上=文字区，左下=×，右下=√（各含自身背景，悬停整体提亮） */
  #menu-homeopt-text { left:0;  top:0;  width:160px; height:63px; background-position: 0 0;      pointer-events:none; }
  #menu-homeopt-no   { left:0;  top:63px; width:80px; height:37px; background-position: 0 -63px;  }   /* × 返回 */
  #menu-homeopt-yes  { left:80px; top:63px; width:80px; height:37px; background-position: -80px -63px; }  /* √ 确认 */
  #menu {                                        /* 主键：常驻态（收起时显示） */
    position:absolute; left:0; top:860px; width:40px; height:100px;
    background: url("art/menu/menu_CH.png") 0 0/40px 100px no-repeat;
    z-index:50;                     /* 主键在存档黑幕(z40) 之上（存档时可见但不可点） */
    cursor: var(--c-point);
    transition: opacity .18s ease;
  }
  #menu.hidden { opacity:0; pointer-events:none; }
  #menu:hover { filter: brightness(1.4) saturate(1.15); }

  /* ---------- 存档外显：全屏黑屏 + 左下角"正在储存进度"提示 ----------
     触发点=P1 末尾 / P2 末尾 / R1 四区域末尾（各区域大物象段完成）；
     黑屏淡入 → 提示闪烁 3 秒 → 场景切换（在黑幕后发生）→ 淡出揭幕。
     存档期间 menu 组（z50）浮在黑幕之上仍可见，但 .saving 态剥夺其 pointer-events=不可点。
     提示图 save_CH/EN.png（900×300 → 显示 240×80，÷3.75），左上角 (0,980)（上缘距主菜单底部 20px）；
     闪烁=3 秒内明灭三次（每秒一亮一暗），最暗 40% 不透明度 */
  #save-veil {
    position:absolute; left:0; top:0; width:1920px; height:1080px;
    background:#000; z-index:40;               /* 压过文本栏(z10)；menu 组(z50) 在其上 */
    opacity:0; pointer-events:none; transition: opacity .3s ease;
  }
  #save-veil.on { opacity:1; pointer-events:auto; }
  .saving #menu, .saving .menu-btn, .saving .menu-opt { pointer-events:none; }   /* 存档中 menu 可见不可点 */
  #save-icon {
    position:absolute; left:0; top:980px; width:240px; height:80px;
    background: url("art/menu/save_CH.png") 0 0/240px 80px no-repeat;
    opacity:0; visibility:hidden;
  }
  #save-veil.on #save-icon { opacity:1; visibility:visible; }
  #save-icon.blink { animation: saveblink 3s ease-in-out 1; }
  @keyframes saveblink {        /* 渐变明灭三次（呼吸式渐亮渐暗）：峰=原亮相中点(0.25/1.25/2.25s)、
                                  谷=原暗相中点(0.75/1.75/2.75s)——最亮最暗时间点与原硬切换版一致；
                                  亮 100% ↔ 暗 40%，段间 ease-in-out 平滑过渡 */
    0%     { opacity:0.7; }
    8.33%  { opacity:1; }
    25%    { opacity:0.4; }
    41.67% { opacity:1; }
    58.33% { opacity:0.4; }
    75%    { opacity:1; }
    91.67% { opacity:0.4; }
    100%   { opacity:0.7; }
  }
  /* ═══════════ R3 作诗画布（并入） ═══════════ */

  :root {
    --paper:        #ece5d6;        /* 仅作衬底/UI 配色参考，主背景改用图片 */
    --paper-edge:   #d8cfba;
    --ink:          #2c2a26;
    --hint:         #8a8275;
    /* 五情色（对齐 docs/PHASE3_REGIONS.md 的 EMO_COLOR） */

  }
  #r3-layer {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: url('art/bg/paper_bg.png') center / cover no-repeat #e8e3d6;

    color: var(--ink);

    -webkit-user-select: none;
  }
  #r3-canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #r3-canvas.grabbing { cursor: grabbing; }

  /* R3 左下提示已隐藏（2026-09-06 用户指令）；取景按钮已隐藏（V 键仍可用） */
  #r3-layer .hint { display: none; }
  .hint b { color: var(--ink); font-weight: 600; }

  /* 情感图例（2026-09-06 用户指令：右侧中部 → 右下角） */
  #r3-layer .legend {
    position: fixed; right: 36px; bottom: 36px;
    display: flex; flex-direction: column; gap: 14px;
    pointer-events: none;
  }
  #r3-layer .legend .row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--hint); }
  #r3-layer .legend .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 8px currentColor; opacity: 0.85; }
  #r3-layer .legend .row .name { font-family: inherit; }

  /* ── 取景模式（按钮已隐藏，V 键唤出） ── */
  #r3-framingBtn { display: none; }
  #r3-framingPanel {
    position: fixed; right: 36px; bottom: 80px;
    width: 250px; padding: 12px 14px;
    background: rgba(236,229,214,0.96);
    border: 1px solid rgba(90,80,60,0.45);
    border-radius: 6px;
    font-size: 12px; color: var(--ink);
    box-shadow: 0 4px 18px rgba(60,50,30,0.18);
  }
  #r3-framingPanel .fp-title {
    font-size: 13px; letter-spacing: 2px; margin-bottom: 8px;
    border-bottom: 1px solid rgba(90,80,60,0.3); padding-bottom: 6px;
  }
  #r3-framingPanel .fp-row { display: flex; justify-content: space-between; margin: 3px 0; color: var(--hint); }
  #r3-framingPanel .fp-row b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  #r3-framingPanel .fp-slider {
    display: grid; grid-template-columns: 62px 1fr 44px;
    align-items: center; gap: 6px; margin: 4px 0;
  }
  #r3-framingPanel .fp-slider span { color: var(--hint); }
  #r3-framingPanel .fp-slider input[type="range"] {
    width: 100%; height: 14px; margin: 0; cursor: pointer;
    accent-color: #8a7a5c;
  }
  #r3-framingPanel .fp-slider b {
    color: var(--ink); font-weight: 600; font-size: 11px;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  #r3-framingPanel .fp-hint { margin: 8px 0 10px; color: var(--hint); line-height: 1.5; }
  #r3-framingPanel .fp-order-title {
    font-size: 12px; color: var(--hint); margin: 2px 0 6px;
  }
  #r3-fpOrder { display: flex; flex-direction: column; gap: 3px; max-height: 230px; overflow-y: auto; }
  #r3-fpOrder .ord-row {
    display: grid; grid-template-columns: 18px 1fr 38px 54px;
    align-items: center; gap: 6px;
    padding: 2px 6px; border-radius: 4px;
    background: rgba(60,55,48,0.05);
    font-size: 12px; cursor: grab;
    border: 1px solid transparent;
  }
  #r3-fpOrder .ord-row.src { opacity: 0.4; cursor: grabbing; }
  #r3-fpOrder .ord-row.above { border-top: 2px solid rgba(160,60,50,0.8); }
  #r3-fpOrder .ord-row.below { border-bottom: 2px solid rgba(160,60,50,0.8); }
  #r3-fpOrder .ord-num { color: var(--hint); font-variant-numeric: tabular-nums; }
  #r3-fpOrder .ord-name { color: var(--ink); }
  #r3-fpOrder .ord-tag {
    font-size: 10px; text-align: center; border-radius: 3px; padding: 1px 0;
    color: #fff; opacity: 0.85;
  }
  #r3-fpOrder .ord-size {
    font-variant-numeric: tabular-nums; color: var(--hint); font-size: 11px; text-align: right;
  }
  #r3-fpOrder .ord-size input {
    width: 100%; height: 12px; margin: 0; cursor: ew-resize; accent-color: #8a7a5c;
  }
  #r3-framingPanel button {
    font-family: inherit; font-size: 12px; margin-right: 6px; margin-top: 2px;
    padding: 4px 10px; border-radius: 4px; cursor: pointer;
    border: 1px solid rgba(90,80,60,0.5); background: rgba(255,252,245,0.8); color: var(--ink);
  }
  #r3-framingPanel button:hover { background: #fff; }
  #r3-framingPanel .fp-code {
    margin-top: 10px; padding: 6px 8px;
    background: rgba(60,55,48,0.08); border-radius: 4px;
    font-family: Consolas, monospace; font-size: 11px;
    word-break: break-all; color: var(--ink);
    white-space: pre; display: none;
  }

  /* ── R3 并入主 demo 的定位样式 ── */
  #r3-layer {
    position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
    z-index: 40;                                   /* 高于游戏各层（文本栏 z10 / menu z50 之下被 menu 盖住的层级按需再调） */
    background: url('art/bg/paper_bg.png') center / cover no-repeat #e8e3d6;
    font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif;
    color: var(--ink, #2c2a26);
    user-select: none; -webkit-user-select: none;
  }
  /* R3 激活时主游戏层吞掉交互（body.r3-active 由 R3Canvas.enter() 切换；
     画布全屏接管点击/滚轮；menu z50 仍浮于其上可点） */
  body.r3-active #hotspots,
  body.r3-active #textbox,
  body.r3-active #paper-marks { pointer-events: none; }
</style>

/* ── 运动学参数（2026-09-06 定案：无弹簧、步进轮播、点击驱动） ──
 * frame 序列在均匀位置点间行进：
 *  - 点击 frame/空白 → snapTarget 步进吸附动画（指数趋近）
 *  - BREATHE：闲置呼吸感（渲染 sin 偏移，纯视觉；动画中/取景时停止） */
const BREATHE = {
  TANG_AMP: 10,        // 闲置切向摆幅（世界 px）
  Z_AMP:    7,         // 闲置 z 呼吸幅度
  FREQ:     0.45,      // 呼吸频率（rad/s，慢）
};

/* ── 椭圆轨道：所有 frame 围成的形状 ──
 * 常轴倾斜椭圆，长轴沿 y=x 对角线（数学一、三象限方向），焦点落在一三象限。
 * 椭圆平面本身带固定倾角 zSlope：左下端（一象限对角 *屏幕左下*，u<0）z 为正 → 离屏幕更近；
 * 右上端相反（更远）。近大远小由透视自然给出。
 * a/b/tilt/中心均可在取景模式实时调。 */
const ELLIPSE = {
  a:       410,          // 半长轴（世界单位）
  b:       240,          // 半短轴
  tilt:    Math.PI / 4,  // 长轴倾角：一三象限对角线
  zSlope:  0.35,         // 平面倾角斜率：z = -u·zSlope（u=长轴分量；左下近、右上远）
  zJit:    55,           // 各 frame 私有 z 偏移（前后层次）
  innerK:  0.60,         // 连线端点内椭圆比例（同 theta 同平面，与外椭圆平行；可调）
};

/* 投影中心（屏幕比例坐标）——取景模式可调 */
const STAGE = {
  cx: 0.28,   // 画面 x 比例（0.28 = 左半中部）
  cy: 0.50,   // 画面 y 比例
};

  homePitch: 0,

};

/* ── 取景存档（localStorage 自动保存/恢复） ──

 * "固定此视角"= 写入 localStorage，刷新自动恢复；代码行仍显示（便于归档进源码）。 */
const SAVE_KEY = 'r3_framing_v2';
const DEFAULTS = {
  homeYaw: 0, homePitch: 0, homeFOC: 620,
  a: ELLIPSE.a, b: ELLIPSE.b, tilt: ELLIPSE.tilt, zSlope: ELLIPSE.zSlope, innerK: ELLIPSE.innerK,
  cx: STAGE.cx, cy: STAGE.cy,
};
function saveFraming(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      homeYaw: VIEW.homeYaw, homePitch: VIEW.homePitch, homeFOC: VIEW.homeFOC,
      a: ELLIPSE.a, b: ELLIPSE.b, tilt: ELLIPSE.tilt, zSlope: ELLIPSE.zSlope, innerK: ELLIPSE.innerK,
      cx: STAGE.cx, cy: STAGE.cy,
      sizes: FRAGMENTS.map(f => f.size),
      order: state.order ? state.order.slice() : null,
    }));
  }catch(e){ /* file:// 或隐私模式下可能不可用，静默降级 */ }
}
function loadFraming(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!s) return;
    VIEW.homeYaw = s.homeYaw; VIEW.homePitch = s.homePitch; VIEW.homeFOC = s.homeFOC;
    VIEW.yaw = s.homeYaw; VIEW.pitch = s.homePitch; VIEW.FOC = s.homeFOC;
    ELLIPSE.a = s.a; ELLIPSE.b = s.b; ELLIPSE.tilt = s.tilt; ELLIPSE.zSlope = s.zSlope;
    if (s.innerK !== undefined) ELLIPSE.innerK = s.innerK;
    STAGE.cx = s.cx; STAGE.cy = s.cy;
    // 大小/次序在 init() 建好默认结构后由 applySavedLayout() 恢复
    state.savedLayout = { sizes: s.sizes, order: s.order };
  }catch(e){ /* 损坏数据忽略 */ }
}
/* init 之后调用：把存档的大小/次序套进运行时结构（槽位角均匀现算，无需存档） */
function applySavedLayout(){
  const sl = state.savedLayout;
  if (!sl) return;
  if (Array.isArray(sl.order) && sl.order.length === FRAGMENTS.length &&
      sl.order.every(v => Number.isInteger(v) && v >= 0 && v < FRAGMENTS.length) &&
      new Set(sl.order).size === FRAGMENTS.length){
    state.order = sl.order.slice();
    state.order.forEach((fi, k) => { state.slotIdx[fi] = k; });
  }
  if (Array.isArray(sl.sizes) && sl.sizes.length === FRAGMENTS.length){
    sl.sizes.forEach((v, i) => {
      if (typeof v === 'number' && isFinite(v)) FRAGMENTS[i].size = v;
    });
  }
  state.savedLayout = null;
  updateHomes();
}
function clearFraming(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  VIEW.homeYaw = DEFAULTS.homeYaw; VIEW.homePitch = DEFAULTS.homePitch; VIEW.homeFOC = DEFAULTS.homeFOC;
  VIEW.yaw = DEFAULTS.homeYaw; VIEW.pitch = DEFAULTS.homePitch; VIEW.FOC = DEFAULTS.homeFOC;
  ELLIPSE.a = DEFAULTS.a; ELLIPSE.b = DEFAULTS.b; ELLIPSE.tilt = DEFAULTS.tilt; ELLIPSE.zSlope = DEFAULTS.zSlope;
  ELLIPSE.innerK = DEFAULTS.innerK;
  STAGE.cx = DEFAULTS.cx; STAGE.cy = DEFAULTS.cy;
  // 只重置布点结构（不动 home/img 等已建容器，避免重复 push 翻倍）
  const idIndex = new Map(FRAGMENTS.map((f, i) => [f.id, i]));
  state.order = [];
  ORBIT_ORDER.forEach((id, k) => {
    const i = idIndex.get(id);
    if (i === undefined) return;
    state.order.push(i);
    state.slotIdx[i] = k;
  });
  FRAGMENTS.forEach((f, i) => { f.size = DEFAULTS_SIZES[i]; });
  state.shift = 0; state.settled = 0; state.snapTarget = null;
  updateHomes();
  syncSliders();
  renderOrderList();
}
/* 默认大小快照（FRAGMENTS 定义后立即抓取，防 clear 后丢失） */
const DEFAULTS_SIZES = FRAGMENTS.map(f => f.size);

/* ── 状态 ── */
const state = {
  home: [],   // 椭圆锚点 = frame 实际位置（严格贴轨迹）
  order:  [],   // 槽位序列（存 frame index，列表第 k 项 = 槽位 k 的 frame）
  slotIdx: [],  // 各 frame 在序列中的槽位号（frame i 占 slot slotIdx[i]；槽位角=均匀现算）
  shift: 0,     // 当前序列位移（浮点，动画中连续；静止时=整数槽位）
  settled: 0,   // 上次停靠的整数槽位（步进轮播的基准）
  snapTarget: null,  // 松手后的步进目标（null=无动画）
  lastDir: 1,   // 最近一次旋转方向（+1/-1），用于"不足一步也前进一格"
  phase:[],   // 各呼吸相位
  img:  [],   // HTMLImageElement
  natW: [],
  natH: [],
  hover: -1,
  selectedFrame: -1,  // 点击记录（渲染实际跟随 slot2Frame；拖拽/动画中全黑线）
  dragging: false,
  framing: false,  // 取景模式：显示 camera/椭圆可视化，拖拽=调视角
  sil:     [],  // 大物象的 alpha 边界内剪影（RGBA PNG），加载自 <name>_sil.png
  loaded: false,
};

const canvas = document.getElementById('r3-canvas');
const ctx    = canvas && canvas.getContext ? canvas.getContext('2d') : null;   // 无头（sim）降级：null
let DPR = Math.max(1, window.devicePixelRatio || 1);
let W = 0, H = 0;

/* 均匀槽位模型（2026-09-06 定案）：
 * 槽位角 = slotIdx·(2π/N) + shift·(2π/N) + 常量偏移 0.30
 * —— frame 严格贴椭圆、间距统一（2号位为标准平均分配边距）；
 *    旧的 slots[]（可拖不均匀位置点）与 zOff（私有 z 抖动）均已废弃 */

/* 按当前 shift 重算所有锚点（序列行进 = frame 在位置点间插值移动）
 * 槽位角恒为均匀（2π/N 等分，锚点微调已废弃）——frame 严格在椭圆上、间距统一 */
function updateHomes(){
  const { a, b, tilt, zSlope } = ELLIPSE;
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const N = state.order.length;
  const step = (Math.PI * 2) / N;
  for (let i=0; i<FRAGMENTS.length; i++){
    const th = state.slotIdx[i] * step + state.shift * step + 0.30;
    const u = a * Math.cos(th);   // 长轴方向分量（右上为正）
    const v = b * Math.sin(th);   // 短轴方向分量
    const h = state.home[i];
    h[0] = u * ct - v * st;
    h[1] = u * st + v * ct;
    h[2] = -u * zSlope;          // 左下(u<0)近、右上(u>0)远（zOff 已废弃：frame 严格贴椭圆平面）
  }
}

/* ── 初始化：槽位分配（order 存 frame index 序列；槽位角=均匀，由 updateHomes 现算） ── */
function init(){
  const N = FRAGMENTS.length;
  const idIndex = new Map(FRAGMENTS.map((f, i) => [f.id, i]));
  state.order = [];
  state.slotIdx = new Array(N).fill(0);
  ORBIT_ORDER.forEach((id, k) => {
    const i = idIndex.get(id);
    if (i === undefined) { console.warn('ORBIT_ORDER 未知 id:', id); return; }
    state.order.push(i);
    state.slotIdx[i] = k;
  });
  for (let i=0; i<N; i++){
    state.home.push([0,0,0]);
    state.phase.push(Math.random()*Math.PI*2);
    state.img.push(null);
    state.sil.push(null);
    state.natW.push(1); state.natH.push(1);
  }
  updateHomes();
}

function loadImages(){
  if (typeof Image !== 'function') return Promise.resolve();   // 无头环境（sim）降级
  const tasks = FRAGMENTS.map((f, i) => new Promise((res) => {
    const im = new Image();
    im.onload  = () => { state.img[i]=im; state.natW[i]=im.naturalWidth; state.natH[i]=im.naturalHeight; res(); };
    im.onerror = () => { console.warn('image failed:', f.src); res(); };
    im.src = f.src;
  }));
  // 大物象的 alpha 边界内剪影（Python 离线生成；这里只加载，不做像素计算 → 无 file:// taint 问题）
  const silTasks = FRAGMENTS.map((f, i) => new Promise((res) => {
    if (!f.silSrc){ state.sil[i] = null; return res(); }
    const im = new Image();
    im.onload  = () => { state.sil[i] = im; res(); };
    im.onerror = () => { console.warn('silhouette failed:', f.silSrc); state.sil[i] = null; res(); };
    im.src = f.silSrc;
  }));
  return Promise.all([Promise.all(tasks), Promise.all(silTasks)]);
}

/* ── 画布尺寸 ── */
function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  if (!canvas || !ctx) return;   // 无头环境降级
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  renderBgCanvas();
}
window.addEventListener('resize', resize);

/* ── 背景快照画布：复刻 body 的图片背景（2026-09-06 改为用户图） ──
 * 大物象透明（水墨），互相透叠会脏——画一块"与背景完全同色"的衬底挡住后方。
 * 做法：把背景图片按 CSS `center/cover` 规则渲染到离屏 canvas，衬底 = drawImage 同区域 → 逐像素一致，无缝。 */
const bgImg = (typeof Image === 'function') ? new Image() : null;   // 无头降级
let bgImgReady = false;
if (bgImg){
  bgImg.onload  = () => { bgImgReady = true; renderBgCanvas(); };
  bgImg.onerror = () => { console.warn('背景图加载失败：art/bg/paper_bg.png'); };
  bgImg.src = 'art/bg/paper_bg.png';
}
const bgCanvas = document.createElement('canvas');
function renderBgCanvas(){
  bgCanvas.width = Math.max(1, Math.floor(W));
  bgCanvas.height = Math.max(1, Math.floor(H));
  const b = bgCanvas.getContext('2d');
  b.setTransform(1, 0, 0, 1, 0, 0);
  // 平铺底色（图片加载前的占位 + 加载失败时的回退）
  b.fillStyle = '#e8e3d6';
  b.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  if (!bgImgReady) return;
  // 按 `cover` 规则把背景图缩放并居中裁切铺满（与 CSS `background: ... center / cover` 对齐）
  const iw = bgImg.naturalWidth, ih = bgImg.naturalHeight;
  const scale = Math.max(bgCanvas.width / iw, bgCanvas.height / ih);
  const dw = iw * scale, dh = ih * scale;
  const dx = (bgCanvas.width  - dw) / 2;
  const dy = (bgCanvas.height - dh) / 2;
  b.drawImage(bgImg, dx, dy, dw, dh);
}

/* ── 鼠标交互（2026-09-06 定案：摇杆移除，旋转唯一方式 = 点击） ──
 * 轮盘 = 步进轮播（frame 序列在均匀位置点间行进）：
 *   - 点击 frame → 盘旋转（最短路径）使该 frame 落到 2 号位置
 *   - 点击空白 → 前进一格（方向 = 最近一次旋转方向）
 *   - 转动过程中所有线条压黑，落位静止后 2 号位物象的相关线变彩色
 * 取景模式（V）：拖拽 = 调视角，滚轮 = 调焦距（锚点处滚轮 = 调 frame 大小） */
let lastMX = 0, lastMY = 0;

const EDIT = {
  hitR: 20,          // 锚点命中半径（屏幕 px，取景滚轮调大小用）
};

/* 松手：步进吸附。本次手势从 settled 起，若旋转不足一格也自动轮播一格 */
function releaseSnap(){
  if (state.framing) return;
  const moved = state.shift - state.settled;
  let steps;
  if (Math.abs(moved) < 1e-6) steps = state.lastDir * 1;   // 原地松手也前进一格
  else steps = Math.sign(moved) * Math.max(1, Math.round(Math.abs(moved)));
  state.snapTarget = state.settled + steps;
}

/* 每帧：吸附动画（指数趋近目标槽位） */
function stepSnap(){
  if (state.snapTarget === null || state.framing) return;
  state.shift += (state.snapTarget - state.shift) * 0.10;
  if (Math.abs(state.snapTarget - state.shift) < 0.0015){
    state.shift = state.snapTarget;
    state.settled = state.snapTarget;
    state.snapTarget = null;
  }
  updateHomes();
}

/* 取景模式：屏幕点命中哪个锚点（frame index） */
function hitAnchor(mx, my){
  let best = -1, bestD = EDIT.hitR;
  state.home.forEach((h, i) => {
    const p = project(h, VIEW.yaw, VIEW.pitch);
    const d = Math.hypot(mx - p.x, my - p.y);
    if (d < bestD){ bestD = d; best = i; }
  });
  return best;
}

canvas.addEventListener('mousedown', e => {
  if (state.framing){
    // 取景模式：拖拽调视角
    state.dragging = true; lastMX = e.clientX; lastMY = e.clientY;
    canvas.classList.add('grabbing');
    return;
  }
  // 正常模式：点击 frame → 盘旋转使该 frame 到 2 号位（唯一控制方式）
  const hit = hitFrame(e.clientX, e.clientY);
  if (hit >= 0){
    selectFrameToSlot2(hit);
    return;
  }
  // 点击空白：前进一格（方向=最近旋转方向）
  releaseSnap();
});
/* 屏幕点命中哪个 frame（投影矩形内取最近中心） */
function hitFrame(mx, my){
  let best = -1, bestD = 1e9;
  state.home.forEach((h, i) => {
    if (!state.img[i]) return;
    const p = project(h, VIEW.yaw, VIEW.pitch);
    const f = FRAGMENTS[i];
    const dispH = f.size * p.s, dispW = dispH * (state.natW[i]/state.natH[i]);
    const dx = mx - p.x, dy = my - p.y;
    if (Math.abs(dx) < dispW/2 && Math.abs(dy) < dispH/2){
      const d = Math.hypot(dx, dy);
      if (d < bestD){ bestD = d; best = i; }
    }
  });
  return best;
}
/* 选中 frame i：盘旋转（最短步数）使 frame i 落到 2 号位置（槽位 1）
 * 注：selectedFrame 仅为点击记录；线条颜色实时跟随 2 号位当前占据者（slot2Frame），
 * 点击哪个 frame 都会改变 2 号位占据者 → 高亮随之转移 */
function selectFrameToSlot2(i){
  state.selectedFrame = i;
  const k = state.slotIdx[i];               // 当前槽位
  const N = state.order.length;
  // 落位条件：slotIdx[i] + shift ≡ 1 (mod N) → steps = 1 - k - settled（模 N 最短）
  let steps = ((1 - k - state.settled) % N + N) % N;
  if (steps > N/2) steps -= N;
  state.snapTarget = state.settled + steps;
  state.lastDir = Math.sign(steps) || 1;
}
/* 实时：当前占据 2 号位（槽位 1）的 frame（渲染层用它决定线条颜色归属）
 * 切换阈值 0.4：动画走过 40% 即认领新占据者（颜色提前切换，减小延迟） */
function slot2Frame(){
  const N = state.order.length;
  if (!N) return -1;
  // frame i 的有效槽位 = slotIdx[i] + floor(shift+0.4)（mod N）；求有效槽位 ≡ 1 的 frame
  const eff = Math.floor(state.shift + 0.4);
  for (let i=0; i<FRAGMENTS.length; i++){
    if ((((state.slotIdx[i] + eff) % N) + N) % N === 1) return i;
  }
  return -1;
}
/* 是否已接近落位（动画走完 ~70% 即认为"够近"，线条颜色提前恢复） */
function nearSettled(){
  if (state.snapTarget === null) return true;
  return Math.abs(state.snapTarget - state.shift) < 0.3;
}
window.addEventListener('mouseup', () => {
  state.dragging = false;
  canvas.classList.remove('grabbing');
});
window.addEventListener('mousemove', e => {
  if (!state.dragging) return;
  if (state.framing){
    // 取景模式：拖拽调视角
    const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
    lastMX = e.clientX; lastMY = e.clientY;
    VIEW.yaw   -= dx * 0.004;
    VIEW.pitch -= dy * 0.004;
    VIEW.pitch = Math.max(-1.35, Math.min(1.35, VIEW.pitch));
  }
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (state.framing){
    // 取景模式：锚点附近滚轮 = 调该 frame 大小；否则 = 调焦距
    const hit = hitAnchor(e.clientX, e.clientY);
    if (hit >= 0){
      const f = FRAGMENTS[hit];
      f.size = Math.max(30, Math.min(400, f.size - Math.sign(e.deltaY) * 4));
      saveFraming();
    } else {
      VIEW.FOC = Math.max(450, Math.min(1100, VIEW.FOC + e.deltaY * 0.5));
    }
    return;
  }
  // 正常模式：滚轮 = 步进轮播。下滚（deltaY>0）= 顺时针（shift 减小）；上滚 = 逆时针。
  // 无论滚动量多小，只要发生了滚动事件就轮替一格（吸附动画自动补足）。
  const dir = e.deltaY > 0 ? -1 : 1;   // 顺时针 = -1（shift 减小），逆时针 = +1
  state.lastDir = dir;
  // 基准 = 当前动画目标（若在动画中）或已停稳位置 → 在其基础上再进一格
  const base = (state.snapTarget !== null) ? state.snapTarget : state.settled;
  state.snapTarget = base + dir;
}, {passive:false});
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  lastMX = t.clientX; lastMY = t.clientY;
  if (state.framing){ state.dragging = true; return; }
  // 触屏：点击物象 → 盘旋转到 2 号位；空白 → 前进一格
  const hit = hitFrame(t.clientX, t.clientY);
  if (hit >= 0) selectFrameToSlot2(hit);
  else releaseSnap();
}, {passive:true});
canvas.addEventListener('touchmove', e => {
  if (!state.dragging) return;
  const t = e.touches[0];
  if (state.framing){
    const dx = t.clientX - lastMX, dy = t.clientY - lastMY;
    lastMX = t.clientX; lastMY = t.clientY;
    VIEW.yaw   -= dx * 0.004;
    VIEW.pitch -= dy * 0.004;
    VIEW.pitch = Math.max(-1.35, Math.min(1.35, VIEW.pitch));
  }
}, {passive:true});
canvas.addEventListener('touchend', () => {
  state.dragging = false;
});

/* ── 旋转/投影辅助 ──
 * 约定：相机位于 (0,0,+FOC)，看向原点；z 越大越靠近相机，越大 s 越大。
 * 因此投影 s = FOC/(FOC-z)；painter 排序按 z 升序（远→近→先画后画）。 */
function rotate(p, yaw, pitch){
  // Yaw: 绕 Y 轴旋转 (x, z)
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const x1 =  p[0]*cy - p[2]*sy;
  const z1 =  p[0]*sy + p[2]*cy;
  const y1 =  p[1];
  // Pitch: 绕 X 轴旋转 (y, z)
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const y2 =  y1*cp - z1*sp;
  const z2 =  y1*sp + z1*cp;
  return [x1, y2, z2];
}
function project(p, yaw, pitch){
  const r = rotate(p, yaw, pitch);
  const z = Math.min(r[2], VIEW.FOC - 60);   // 防止穿到相机后
  const s = VIEW.FOC / (VIEW.FOC - z);
  const cx = W * STAGE.cx;   // 网络中心（屏幕比例坐标，取景模式可调）
  const cy = H * STAGE.cy;
  return {
    x:  cx + r[0] * s,
    y:  cy - r[1] * s,
    s:  s,
    z:  z,
  };
}

/* 轮盘运动学已并入 stepSnap（步进轮播吸附）——见交互区 */

/* ── 渲染 ── */
function render(t){
  ctx.clearRect(0,0,W,H);

  // frame 实际位置 = 椭圆锚点（严格贴轨迹）；
  // 闲置时叠加呼吸偏移（纯视觉 sin，拖拽/取景时冻结 → 旋转中 depth/倾角绝对静止）
  const tNow = t * 0.001;
  const breathing = !state.dragging && !state.framing;
  const proj = state.home.map((h, i) => {
    if (!breathing) return project(h, VIEW.yaw, VIEW.pitch);
    const ph = state.phase[i];
    const tx = -h[1], ty = h[0];                   // 锚点切向（x-y 平面内）
    const tl = Math.hypot(tx, ty) + 1e-6;
    const sw = Math.sin(tNow * BREATHE.FREQ + ph);
    return project([
      h[0] + (tx/tl) * sw * BREATHE.TANG_AMP,
      h[1] + (ty/tl) * sw * BREATHE.TANG_AMP,
      h[2] +        Math.cos(tNow * BREATHE.FREQ * 0.8 + ph) * BREATHE.Z_AMP,
    ], VIEW.yaw, VIEW.pitch);
  });

  // 找最近悬停（未拖拽时）
  if (!state.dragging){
    let best = -1, bestD = 28;
    const mx = lastMouseX, my = lastMouseY;
    for (let i=0; i<proj.length; i++){
      const f = FRAGMENTS[i];
      const ph = proj[i];
      const dispH = f.size * ph.s;
      // 简化为以矩形中心为命中点
      const dx = mx - ph.x, dy = my - ph.y;
      const d  = Math.hypot(dx, dy);
      if (d < dispH * 0.45 && d < bestD){ bestD = d; best = i; }
    }
    state.hover = best;
  } else {
    state.hover = -1;
  }

  // ① 绘制同情感曲线（在所有 frame 下层）
  drawEmotionCurves(proj, t);

  // ② 按 z 排序绘制 frame
  const order = proj.map((p,i)=>i).sort((a,b)=> proj[a].z - proj[b].z);
  for (const i of order){
    drawFrame(i, proj[i]);
  }

  // ③ 2 号位情感注（静止且无交互时显示在 2 号位物象右侧）
  drawSlot2Note();

  // ④ 取景模式：椭圆 3D 轨迹 + 锚点标记 + 相机 HUD
  if (state.framing){
    drawOrbitGuide();
    drawAnchorMarks();
    drawCamHUD();
  }
}

/* 2 号位情感注：仅当【完全静止】（无拖拽、无吸附动画、无悬停）时显示。
 * 位置 = 2 号位物象投影右侧，垂直居中；三行结构：
 *   [山/冰河/...]（物象路径组，情感色） / 黑文案 / [情感：哀/思]（情感色） */
const EMO_CN = { joy:'喜', sorrow:'哀', ease:'闲', contemplation:'思', wistful:'惘' };
/* 物象 → R1 所属区域的全部物象（按实际情况；雪崩同化时同区域碎片一起计） */
const REGION_NAMES = {
  glacier: ['山','冰河','冻湖','枯林'],   // R1 四大区域
  wood:    ['山','冰河','冻湖','枯林'],
  mountain:['山','冰河','冻湖','枯林'],
  lake:    ['山','冰河','冻湖','枯林'],
  // 小物象列出 R1 里实际交互到的物象名
  hoofprint: ['马蹄印'],
  rotleaves: ['腐叶'],
  stones:    ['石堆'],
  reed:      ['残苇'],
  icecrunch: ['冰碴'],
  snap:      ['枯枝'],
  arrow:     ['箭镞'],
  horse:     ['斑骓'],
  lantern:   ['远帐灯'],
  star:      ['星影'],
};
function drawSlot2Note(){
  if (state.framing) return;
  // 静止判定：无拖拽、无吸附动画、无任何悬停
  if (state.dragging || state.snapTarget !== null || state.hover >= 0) return;

  const i = slot2Frame();
  if (i < 0) return;
  const f = FRAGMENTS[i];
  // 物象×情感专属文案；无对应（情感不在该物象路径上）→ 回退五情通用句
  const note = (FRAGMENT_NOTE[f.id] && FRAGMENT_NOTE[f.id][f.emotion])
            || EMO_NOTE_FALLBACK[f.emotion];
  if (!note) return;

  // 该物象在 R3 的全部可能情感路径（FRAGMENT_NOTE 表的 keys），按五情固定顺序排列
  const EMO_ORDER = ['joy','sorrow','ease','contemplation','wistful'];
  const paths = FRAGMENT_NOTE[f.id]
    ? EMO_ORDER.filter(e => FRAGMENT_NOTE[f.id][e]).map(e => EMO_CN[e])
    : [EMO_CN[f.emotion]];
  const emoLine = `[情感：${paths.join('/')}]`;

  // 物象路径组（上方行）：该物象相关的物象清单
  const regionLine = `[${(REGION_NAMES[f.id] || [f.name]).join('/')}]`;

  // 2 号位 frame 的屏幕投影（帧图右缘）
  const p = project(state.home[i], VIEW.yaw, VIEW.pitch);
  const dispH = f.size * p.s;
  const dispW = dispH * (state.natW[i] / state.natH[i]);
  const x = p.x + dispW/2 + 26;
  const y = p.y;

  ctx.save();
  // 字体字号与 R1 文本栏一致（demo_current.html .line）：
  // 思源宋体 20px / line-height 1.4，无发光
  const FONT = '20px "Source Han Serif SC", "Source Han Serif CN", "思源宋体", "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", serif';
  const SMALL = FONT.replace('20px', '16px');
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  // 第一行：[山/冰河/冻湖/枯林] —— 情感色
  ctx.font = SMALL;
  ctx.fillStyle = EMO_COLOR[f.emotion];
  ctx.fillText(regionLine, x, y - 20 * 1.4);
  // 第二行：黑文案（R1 文本栏样式）
  ctx.font = FONT;
  ctx.fillStyle = '#000000';
  ctx.globalAlpha = 1;
  ctx.fillText(note, x, y);
  // 第三行：[情感：哀/思] —— 情感色
  ctx.font = SMALL;
  ctx.fillStyle = EMO_COLOR[f.emotion];
  ctx.fillText(emoLine, x, y + 20 * 1.4);
  ctx.restore();
}

/* 摇杆可视化已移除（2026-09-06 定案）：旋转唯一方式 = 点击
 * 点 frame → 该 frame 到 2 号位；点空白 → 前进一格 */

/* 取景模式：椭圆 3D 轨迹虚线（含平面倾角的完整椭圆） */
function drawOrbitGuide(){
  const { a, b, tilt, zSlope } = ELLIPSE;
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  ctx.save();
  ctx.strokeStyle = 'rgba(90,80,60,0.55)';
  ctx.lineWidth = 1.4;
  ctx.setLineDash([7,7]);
  ctx.beginPath();
  const M = 96;
  for (let k=0; k<=M; k++){
    const th = (Math.PI * 2 * k) / M;
    const u = a * Math.cos(th), v = b * Math.sin(th);
    const p = project([u*ct - v*st, u*st + v*ct, -u*zSlope], VIEW.yaw, VIEW.pitch);
    if (k === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  // 长轴方向线（虚点，示一三象限对角）
  const pa = project([-a*ct, -a*st,  a*zSlope], VIEW.yaw, VIEW.pitch);
  const pb = project([ a*ct,  a*st, -a*zSlope], VIEW.yaw, VIEW.pitch);
  ctx.setLineDash([2,6]);
  ctx.strokeStyle = 'rgba(90,80,60,0.35)';
  ctx.beginPath();
  ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
  ctx.stroke();
  // 中心点
  const pc = project([0,0,0], VIEW.yaw, VIEW.pitch);
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(90,80,60,0.8)';
  ctx.beginPath(); ctx.arc(pc.x, pc.y, 3, 0, Math.PI*2); ctx.fill();
  ctx.font = '11px serif';
  ctx.fillText('中心', pc.x + 8, pc.y + 4);
  // 近端 / 远端标签
  ctx.fillStyle = 'rgba(60,55,48,0.6)';
  ctx.fillText('近', pa.x - 4, pa.y + 16);
  ctx.fillText('远', pb.x - 4, pb.y - 10);
  ctx.restore();
}

/* 取景模式：锚点标记（frame 当前位置；均匀槽位定案后仅作可视化，滚轮调大小仍可用） */
function drawAnchorMarks(){
  ctx.save();
  ctx.font = '10px serif';
  state.home.forEach((h, i) => {
    const p = project(h, VIEW.yaw, VIEW.pitch);
    ctx.strokeStyle = 'rgba(120,60,50,0.75)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(p.x-5, p.y); ctx.lineTo(p.x+5, p.y);
    ctx.moveTo(p.x, p.y-5); ctx.lineTo(p.x, p.y+5);
    ctx.stroke();
    ctx.fillStyle = 'rgba(120,60,50,0.85)';
    ctx.fillText(FRAGMENTS[i].id, p.x + 10, p.y + 3);
    // hover 命中时显示大小
    if (state.framing && hitAnchor(lastMouseX, lastMouseY) === i){
      ctx.fillStyle = 'rgba(120,60,50,0.9)';
      ctx.fillText(`size ${FRAGMENTS[i].size}`, p.x + 10, p.y + 15);
    }
  });
  // 编辑提示
  ctx.fillStyle = 'rgba(90,80,60,0.7)';
  ctx.fillText('锚点处滚轮=大小 · 拖拽=调视角', W * 0.05, H * 0.06);
  ctx.restore();
}

/* 取景模式：相机俯视 HUD（x-y 平面 + 视线方向） */
function drawCamHUD(){
  const w = 190, h = 150;
  const x0 = W - w - 18, y0 = H - h - 54;
  ctx.save();
  // 纸色底
  ctx.fillStyle = 'rgba(236,229,214,0.94)';
  ctx.strokeStyle = 'rgba(90,80,60,0.45)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x0, y0, w, h, 6); else ctx.rect(x0, y0, w, h);
  ctx.fill(); ctx.stroke();

  const { a, b, tilt } = ELLIPSE;
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  // 世界 → HUD 缩放（俯视 x-y 平面）
  const s2 = 52 / a;
  const cx = x0 + w/2, cy = y0 + h*0.40;

  // 椭圆俯视轮廓
  ctx.strokeStyle = 'rgba(90,80,60,0.6)';
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  const M = 64;
  for (let k=0; k<=M; k++){
    const th = (Math.PI * 2 * k) / M;
    const u = a*Math.cos(th), v = b*Math.sin(th);
    const hx = cx + (u*ct - v*st) * s2;
    const hy = cy - (u*st + v*ct) * s2;
    if (k===0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // 中心
  ctx.fillStyle = 'rgba(90,80,60,0.8)';
  ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI*2); ctx.fill();

  // 视线：原点 → 相机方向（rotate([0,0,FOC]) 的 x-y 分量；pitch 不进俯视图）
  const camDir = rotate([0, 0, VIEW.FOC], VIEW.yaw, VIEW.pitch);
  const dirLen = Math.hypot(camDir[0], camDir[1]) + 1e-6;
  const arrowLen = 46;
  const ax = cx + camDir[0]/dirLen * arrowLen;
  const ay = cy + camDir[1]/dirLen * arrowLen;
  ctx.strokeStyle = 'rgba(160,60,50,0.9)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(cx, cy); ctx.lineTo(ax, ay);
  ctx.stroke();
  // 箭头尖
  const ang = Math.atan2(ay-cy, ax-cx);
  ctx.fillStyle = 'rgba(160,60,50,0.9)';
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax - 6*Math.cos(ang-0.4), ay - 6*Math.sin(ang-0.4));
  ctx.lineTo(ax - 6*Math.cos(ang+0.4), ay - 6*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill();
  // 相机图标
  ctx.strokeStyle = 'rgba(60,55,48,0.85)';
  ctx.lineWidth = 1.2;
  ctx.strokeRect(ax - 7, ay - 5, 14, 10);
  ctx.beginPath(); ctx.arc(ax, ay - 5, 3, 0, Math.PI, true); ctx.stroke();

  // 标注
  ctx.font = '10px serif';
  ctx.fillStyle = 'rgba(90,80,60,0.75)';
  ctx.fillText('俯视 x-y', x0 + 8, y0 + 14);
  ctx.fillStyle = 'rgba(60,55,48,0.85)';
  ctx.fillText('camera', ax + 10, ay + 3);
  ctx.restore();
}

function drawEmotionCurves(proj, t){
  // 连线端点 = 内椭圆（与外椭圆同 theta 同平面，按 innerK 比例缩小 → 严格平行）
  const { a, b, tilt, zSlope, innerK } = ELLIPSE;
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const N = state.order.length;
  const step = (Math.PI * 2) / N;
  const endpoint = (i) => {
    const th = state.slotIdx[i] * step + state.shift * step + 0.30;
    const u = a * innerK * Math.cos(th), v = b * innerK * Math.sin(th);
    return project([u*ct - v*st, u*st + v*ct, -u*zSlope], VIEW.yaw, VIEW.pitch);
  };

  // 按情感分组
  const groups = {};
  FRAGMENTS.forEach((f,i) => {
    if (!f.emotion) return;
    (groups[f.emotion] ||= []).push(i);
  });
  const tNow = t * 0.001;

  // 收集所有曲线段，按平均 z 排序（远的先画）
  // 线条颜色由【2 号位的当前占据者】决定（slot2Frame 实时计算）：
  // 与其相关的线 = 75% 情感色；其余 = 25% 黑
  // inMotion = 拖拽中 或 吸附动画远未到位 → 全部压黑；
  // 接近落位（<0.3 槽位）即提前恢复彩色（延迟减小），且 slot2Frame 在 40% 处已认领新占据者
  const inMotion = state.dragging || !nearSettled();
  const sel = inMotion ? -1 : slot2Frame();
  const segs = [];
  for (const emo in groups){
    const ids = groups[emo];
    if (ids.length < 2) continue;
    const color = EMO_COLOR[emo];
    for (let a=0; a<ids.length; a++){
      for (let b=a+1; b<ids.length; b++){
        const pa = endpoint(ids[a]), pb = endpoint(ids[b]);
        const avgZ = (pa.z + pb.z) * 0.5;
        const related = (sel >= 0 && (ids[a] === sel || ids[b] === sel));
        segs.push({a:pa, b:pb, color, avgZ, emo, related, phase: (ids[a]*7 + ids[b]*3)});
      }
    }
  }
  segs.sort((x,y)=> x.avgZ - y.avgZ);

  for (const s of segs){
    drawWavyCurve(s.a, s.b, s.color, tNow + s.phase * 0.3, s.emo, s.related);
  }
}

function drawWavyCurve(A, B, color, t, emo, related){
  /* 绳子形：端点固定在 frame 上，中点朝屏幕下方悬垂，垂度∝绳长
   * 二次 bezier P0=A, P1=(A+B)/2 + drop·(0,1), P2=B；并加一点沿绳方向的 sin 摆动让绳子"晃动" */
  const dx = B.x - A.x, dy = B.y - A.y;
  const len = Math.hypot(dx, dy) + 1e-6;
  const mx = (A.x + B.x)/2, my = (A.y + B.y)/2;
  const drop = len * 0.18;                    // 垂度：绳长 18%
  const swing = 0.04 * Math.sin(t * 0.9);
  const cx = mx + dx * swing;
  const cy = my + drop        + dy * swing;  // 悬垂朝屏幕下方

  ctx.save();
  if (!related){
    // 与 2 号位物象无关：25% 黑细线（带黑色微光晕）
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = 0.25;
    ctx.shadowColor = '#000000';
    ctx.shadowBlur  = 5;
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.quadraticCurveTo(cx, cy, B.x, B.y);
    ctx.stroke();
    ctx.restore();
    return;
  }
  // 与 2 号位物象相关：75% 情感色
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = color;
  ctx.globalAlpha = 0.75;
  ctx.shadowColor = color;
  ctx.shadowBlur  = 6;
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.quadraticCurveTo(cx, cy, B.x, B.y);
  ctx.stroke();
  ctx.restore();
}

function drawFrame(i, ph){
  const f = FRAGMENTS[i];
  const im = state.img[i];
  if (!im) return;
  // 显示尺寸（按自然比例，保持 baseSize 作为高）
  const dispH = f.size * ph.s;
  const ar    = state.natW[i] / state.natH[i];
  const dispW = dispH * ar;

  // 悬停：白色高亮（亮度+白色光晕）
  const isHover = (i === state.hover);

  const drawX = ph.x - dispW/2;
  const drawY = ph.y - dispH/2;
  // 大物象衬底：在设置 filter 之前画（filter 会让背景色变调，与 R3 背景不同色 → 露馅）
  if (f.paper && state.sil[i]){
    drawPaperBacking(i, drawX, drawY, dispW, dispH);
  }
  ctx.save();
  if (isHover){
    ctx.filter = 'brightness(1.35) drop-shadow(0 0 18px rgba(255,255,255,0.85)) drop-shadow(0 0 36px rgba(255,255,255,0.45))';
  } else {
    // 非悬停：按 z 远端做一点点变暗，层级感
    const dim = 0.18 * Math.max(0, Math.min(1, (200 - ph.z) / 400));
    if (dim > 0) ctx.filter = `brightness(${1-dim})`;
  }
  ctx.drawImage(im, drawX, drawY, dispW, dispH);
  ctx.restore();

  // 悬停名字标签已移除（2026-09-06）：悬停只保留白色高亮
}

/* 大物象衬底：把"当前 R3 背景色"按 alpha 边界内剪影形状画到 frame 后方。
 * 边界内 = flood fill 排除的"外部"以外区域（含原不透明像素 + 被轮廓包围的内部透明洞）。
 * 不用 getImageData → 无 file:// taint 问题；剪影由 Python 离线生成。 */
const paperTmp = document.createElement('canvas');
function drawPaperBacking(i, x, y, w, h){
  const sil = state.sil[i]; if (!sil) return;
  const iw = Math.max(1, Math.ceil(w)), ih = Math.max(1, Math.ceil(h));
  if (paperTmp.width !== iw || paperTmp.height !== ih){ paperTmp.width = iw; paperTmp.height = ih; }
  const tg = paperTmp.getContext('2d');
  tg.setTransform(1, 0, 0, 1, 0, 0);
  tg.clearRect(0, 0, iw, ih);
  // 1) 把剪影形状铺到临时画布（形状=边界内 alpha mask，灰度值任意）
  tg.globalCompositeOperation = 'source-over';
  tg.drawImage(sil, 0, 0, iw, ih);
  // 2) 把"形状 alpha"作为 mask，用 source-in 灌入当前背景快照的同区域颜色
  //    （逐像素 = R3 背景当前位置色 → 衬底与背景无缝）
  tg.globalCompositeOperation = 'source-in';
  const sx = Math.max(0, x), sy = Math.max(0, y);
  const ex = Math.min(W, x + iw), ey = Math.min(H, y + ih);
  if (ex > sx && ey > sy){
    tg.drawImage(bgCanvas, sx, sy, ex - sx, ey - sy, sx - x, sy - y, ex - sx, ey - sy);
    tg.globalCompositeOperation = 'source-over';
    ctx.drawImage(paperTmp, x, y);
  }
}

/* ── 鼠标位置缓存 ── */
let lastMouseX = -9999, lastMouseY = -9999;
canvas.addEventListener('mousemove', e => { lastMouseX = e.clientX; lastMouseY = e.clientY; });
canvas.addEventListener('mouseleave', () => { lastMouseX = -9999; lastMouseY = -9999; state.hover = -1; });
canvas.addEventListener('touchmove', e => {
  const t = e.touches[0]; lastMouseX = t.clientX; lastMouseY = t.clientY;
}, {passive:true});

/* ── 取景模式：可视化 camera + 椭圆，调好视角固定 ── */
const framingBtn   = document.getElementById('r3-framingBtn');
const framingPanel = document.getElementById('r3-framingPanel');
const fpYaw = document.getElementById('fpYaw');
const fpPitch = document.getElementById('fpPitch');
const fpFOC = document.getElementById('fpFOC');
const fpCode = document.getElementById('fpCode');

/* 椭圆/舞台参数的滑条绑定（取景模式实时调） */
const ELLIPSE_SLIDERS = [
  { key:'cx', sId:'fsCx', vId:'fvCx', get:()=>STAGE.cx,   set:v=>STAGE.cx=v,   fmt:v=>v.toFixed(2), from:v=>v },
  { key:'cy', sId:'fsCy', vId:'fvCy', get:()=>STAGE.cy,   set:v=>STAGE.cy=v,   fmt:v=>v.toFixed(2), from:v=>v },
  { key:'a',  sId:'fsA',  vId:'fvA',  get:()=>ELLIPSE.a,  set:v=>ELLIPSE.a=v,  fmt:v=>v.toFixed(0), from:v=>v },
  { key:'b',  sId:'fsB',  vId:'fvB',  get:()=>ELLIPSE.b,  set:v=>ELLIPSE.b=v,  fmt:v=>v.toFixed(0), from:v=>v },
  { key:'t',  sId:'fsT',  vId:'fvT',  get:()=>ELLIPSE.tilt, set:v=>ELLIPSE.tilt=v, fmt:v=>(v*180/Math.PI).toFixed(0)+'°', from:v=>v*180/Math.PI },
  { key:'z',  sId:'fsZ',  vId:'fvZ',  get:()=>ELLIPSE.zSlope, set:v=>ELLIPSE.zSlope=v, fmt:v=>v.toFixed(2), from:v=>v },
  { key:'k',  sId:'fsK',  vId:'fvK',  get:()=>ELLIPSE.innerK, set:v=>ELLIPSE.innerK=v, fmt:v=>v.toFixed(2), from:v=>v },
];
const sliderEls = {};
ELLIPSE_SLIDERS.forEach(cfg => {
  const s = document.getElementById(cfg.sId);
  const val = document.getElementById(cfg.vId);
  sliderEls[cfg.key] = { s, val, cfg };
  s.addEventListener('input', () => {
    cfg.set(+s.value);
    val.textContent = cfg.fmt(cfg.get());
    // a/b/tilt/zSlope 变化会改变锚点几何 → 重算（弹簧平滑过渡到新轨道）
    updateHomes();
    saveFraming();   // 几何参数即时自动保存
  });
});
function syncSliders(){
  ELLIPSE_SLIDERS.forEach(cfg => {
    const el = sliderEls[cfg.key];
    el.s.value = cfg.from(cfg.get());
    el.val.textContent = cfg.fmt(cfg.get());
  });
}

function enterFraming(){
  state.framing = true;
  framingPanel.hidden = false;
  framingBtn.textContent = '取景中…';
  fpCode.style.display = 'none';
  syncSliders();
  renderOrderList();
}
function exitFraming(){
  state.framing = false;
  framingPanel.hidden = true;
  framingBtn.textContent = '取景';
}

/* ── frame 排序列表（取景面板内，拖拽行 = 重排槽位顺序） ──
 * 语义：列表第 k 行 = 槽位 k。拖动行改变 frame 占据的槽位；
 * 每行的滑条直接调该 frame 的 size。列表顺序即画布上的序列顺序。 */
const fpOrder = document.getElementById('r3-fpOrder');
const ordDrag = { row: null, fromK: -1, toK: -1 };

function renderOrderList(){
  if (!fpOrder) return;
  fpOrder.innerHTML = '';
  const N = ORBIT_ORDER.length;
  for (let k=0; k<N; k++){
    const i = state.order[k];
    const f = FRAGMENTS[i];
    const row = document.createElement('div');
    row.className = 'ord-row';
    row.draggable = true;
    row.dataset.k = k;

    const num = document.createElement('span');
    num.className = 'ord-num';
    num.textContent = String(k+1).padStart(2,'0');
    const name = document.createElement('span');
    name.className = 'ord-name';
    name.textContent = f.name + (f.paper ? '' : '');   // 大小物象不特别标注（size 滑条已可见）
    const tag = document.createElement('span');
    tag.className = 'ord-tag';
    tag.textContent = f.emotion ? ({joy:'喜',sorrow:'哀',ease:'闲',contemplation:'思',wistful:'惘'})[f.emotion] : '—';
    tag.style.background = EMO_COLOR[f.emotion] || '#999';
    const size = document.createElement('span');
    size.className = 'ord-size';
    const sizeInput = document.createElement('input');
    sizeInput.type = 'range';
    sizeInput.min = 30; sizeInput.max = 400; sizeInput.step = 2;
    sizeInput.value = f.size;
    const sizeNum = document.createElement('b');
    sizeNum.style.cssText = 'font-weight:600;color:var(--ink);font-size:11px;font-variant-numeric:tabular-nums;';
    sizeNum.textContent = f.size;
    sizeInput.addEventListener('input', () => {
      f.size = +sizeInput.value;
      sizeNum.textContent = sizeInput.value;
      saveFraming();
    });
    size.appendChild(sizeInput);
    size.appendChild(sizeNum);

    row.appendChild(num); row.appendChild(name); row.appendChild(tag); row.appendChild(size);

    // HTML5 拖拽排序
    row.addEventListener('dragstart', e => {
      ordDrag.row = row; ordDrag.fromK = k;
      row.classList.add('src');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(k));
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('src');
      fpOrder.querySelectorAll('.ord-row').forEach(r => r.classList.remove('above','below'));
      ordDrag.row = null;
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (!ordDrag.row || ordDrag.row === row) return;
      fpOrder.querySelectorAll('.ord-row').forEach(r => r.classList.remove('above','below'));
      // 上半部 = 插到该行之前；下半部 = 之后
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      row.classList.add(before ? 'above' : 'below');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      if (ordDrag.fromK < 0) return;
      const rect = row.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      let toK = k + (before ? 0 : 1);
      applyReorder(ordDrag.fromK, toK);
    });

    fpOrder.appendChild(row);
  }
}

/* 把槽位 fromK 的 frame 移动到槽位 toK（列表语义，落点为插入位置） */
function applyReorder(fromK, toK){
  const N = state.order.length;
  const ord = state.order.slice();
  const [moved] = ord.splice(fromK, 1);
  const tk = Math.max(0, Math.min(N, toK > fromK ? toK - 1 : toK));
  ord.splice(tk, 0, moved);
  state.order = ord;
  ord.forEach((fi, k) => { state.slotIdx[fi] = k; });   // 槽位角均匀现算
  updateHomes();
  saveFraming();
  renderOrderList();
}
function toggleFraming(){
  state.framing ? exitFraming() : enterFraming();
}

});
document.getElementById('fpFix').addEventListener('click', () => {

  VIEW.homeYaw   = VIEW.yaw;

  saveFraming();   // 自动存档：刷新后自动恢复，无需复制代码
  fpCode.style.display = 'block';
  fpCode.textContent = [

    `STAGE = { cx:${STAGE.cx.toFixed(2)}, cy:${STAGE.cy.toFixed(2)} }`,
    `（已自动保存，刷新即生效；此代码仅备归档）`,
  ].join('\n');
  console.log('[R3 取景] 固定视角代码：\n' + fpCode.textContent);
});
document.getElementById('fpClear').addEventListener('click', () => {
  clearFraming();
  fpCode.style.display = 'none';
});
window.addEventListener('keydown', e => {
  if (e.key === 'v' || e.key === 'V') toggleFraming();
});
function updateFramingPanel(){
  fpYaw.textContent   = VIEW.yaw.toFixed(3);
  fpPitch.textContent = VIEW.pitch.toFixed(3);
  fpFOC.textContent   = VIEW.FOC.toFixed(0);
}

/* ── 主循环 ── */
function loop(t){
  // 视角：固定（R2→R3 衔接动画已删——视角摇摆/回正全部移除，画面完全静止，
  // 唯一的运动 = 点击驱动的步进吸附 + 闲置时 frame 的呼吸偏移）
  stepSnap();       // 步进轮播吸附动画（点击驱动）
  render(t);
  if (state.framing) updateFramingPanel();

  requestAnimationFrame(loop);
}

/* ── 启动（延迟到 enter()：R2 结束前不加载图片、不跑渲染循环） ── */
let __r3Started = false;
function startAll(){
  if (__r3Started) return true;
  __r3Started = true;
  loadFraming();   // 恢复上次固定视角/椭圆参数（如有存档）
  resize();
  init();          // 建默认位置点/槽位结构
  applySavedLayout();  // 套用存档的位置点与 frame 大小（如有）
  loadImages().then(() => {
    state.loaded = true;
    requestAnimationFrame(loop);
  });
  return true;
}
// 注：resize 监听器在 R3 显示前调用 resize() 是安全的（画布 hidden 时尺寸 0 也能跑）
// 但窗口 resize 事件需要在启动后才有意义——原 demo 顶层绑定的 resize 监听保留

  /* ── 与主引擎的衔接口 ── */
  function enter(){
    const layer = document.getElementById('r3-layer');
    if (!layer) return;
    layer.hidden = false;
    startAll();
    // 画布淡入叠化（1.2s）；body.r3-active 吞掉主游戏层交互（画布全屏接管，menu 仍可用）
    layer.style.opacity = '0';
    layer.style.transition = 'opacity 1.2s ease';
    void layer.offsetWidth;
    layer.style.opacity = '1';
    document.body.classList.add('r3-active');
  }
  function isActive(){ return !document.getElementById('r3-layer').hidden; }
  return { enter, isActive };
})();

          C(false, [
            { label:'倒马回来，查看断面', lines:[
              L('00','你往回捣了几步。断枝处黑漆漆的，树木早已死去，清脆的断裂声原来由这老枝发出的，犹同翠竹抽芽。'),

              L('00','"枯藤老树昏鸦。"彼时黄昏，此时凌晨；彼处古道西风，此处白雪纷纷。无端地，只因为一声枯枝的脆响，你好像也共享了别人词里游子在外的迷茫。'),

          L('00','还未到达枯林，腐叶先被马蹄翻了出来，上头落的雪很快被榨出的汁液染的烂黄。'),
          L('00','一旦有了干涉，再茁壮的叶子在消解时好像也不能体面，再洁白蓬松的雪也要变得很脏。'),

          INC('cnt_sorrow'),
          ITEM('-','item09_01.png'),
          ITEM('+','item09_02.png')

      },

                L('00','视线重新聚焦时，那些粗糙的枝桠在夜空中肆意张开——直的刺向寒空，弯的折向雪地，没有任何章法。'),

                    L('00','二十二岁那年，为了避皇太子的名讳，你将出生就在用的满文名字改了。'),
                    L('00','连名姓都由不得自己，世间荒谬莫过于此。现在想想，你依然闷闷不乐。可享着家族门第的荣宠，你难道又有脸面说自己该拒不改名？'),
                    L('00','说到底，还是你不愿意成为这样的死树罢了。深深吸了一口冰冷的空气，你将心头那股憋闷的浊气无奈地呼出。'),
                    BG('bg14.png'),                 // 回深景
                    ITEM('-','item10_2.png'),
                    TINT('-','tint07.png'),
                    TAG('contemplation','deadwood_canopy'),
                    SET('p3_02_deadwood_canopy'),
                    INC('cnt_contemplation')
                  ]},
                  { label:'敲一敲树干', lines:[
                    L('00','你对这树死了却还能如此洒脱的样子有些不满，便带着几分幼稚的赌气，伸手敲了敲树干。'),
                    L('00','树干纹丝不动，倒是枝头被你震落的碎雪又撒了你一脖子。死树可不会因为你的挑衅改变脾气，若再踢它一脚，无非是自讨苦吃。'),
                    L('00','二十二岁那年，为了避皇太子的名讳，你改了满文名字，在宫里听到新名字，都得恭敬地应着。'),

                    L('00','皇帝对此睁一只眼闭一只眼，懒得搭理。现在想想，在朝廷里还能像捶捶死树一样使些性子，对你而言，或许已经是莫大的恩赐了。'),
                    L('00','收回视线，你将领口往上拉了拉，遮住刺骨的寒风。'),
                    BG('bg14.png'),                 // 回深景
                    ITEM('-','item10_2.png'),
                    TINT('-','tint07.png'),         // 撤特写罩层
                    TAG('wistful','deadwood_canopy'),
                    SET('p3_02_deadwood_canopy'),

                  ]}
                ])
              ]
            },
            {   // 步骤 2：拂开积雪发现箭镞（需步骤 1 完成）

                TINT('+','tint07.png'),
                ITEM('+','item10_3.png'),           // 树干·积雪初始
                ITEM('+','item11_1.png'),           // 箭镞·嵌在树干
                // # [切镜头：树干特写]
                L('00','厚实的雪停留在你的掌心，你看了一会儿，抖掉了他们。'),
                L('00','没有了雪作被子，一枚几乎被树皮包死、锈透了的废铁箭头露了出来。不知道是哪年哪场厮杀留下的。枯木用几年的年轮死死咬住了它，像是在消化一道旧创。'),
                L('00','铁锈已经和木理连在了一起。你扣住箭尾，用劲将它从树干里拔了出来。'),

                ITEM('+','item11_2.png'),

                L('00','尽管如此，你想，当初射出这支箭的人、本该被这支箭射中的人，如今恐怕也都早已化为了枯骨，即使不在这里，也大概在别处。'),
                L('00','功名利禄、边塞厮杀，普通的士兵很容易死，最后留下的不过是这一抹洗不掉的残锈。'),
                L('00','攥紧这枚冰冷的废铁，把它深深按进树根下干净的雪堆里。你不再停留。'),
                ITEM('-','item10_3.png'),           // 段尾直接回大地图（marked 已删 bg14/-tint07 中间步，区域层由段尾防御清理撤净）
                ITEM('-','item11_2.png'),
                TAG('sorrow','arrow'),
                SET('p3_02_arrow'),
                SET('p3_02_deadwood'),
                INC('cnt_sorrow')
              ]
            }

          ITEM('-','item10_2.png'), ITEM('-','item10_3.png'), ITEM('-','item11_2.png'),
          BG('paper_01.png'),
          ITEM('+','lake.png'), ITEM('+','mountain.png'), ITEM('+','river.png'),
          ITEM('+','wood.png'),  ITEM('+','tent.png'),
          ITEM('+','wood_snow.png', 1500),                     // marked: #[+wood_snow.png {fade:1.5}]
          ...(flags.p3_02_lake ? [ITEM('+','lake_snow.png')] : []),
          ...(flags.p3_01_mountain ? [ITEM('+','mountain_snow.png')] : []),
          ...(flags.p3_01_glacier ? [ITEM('+','river_snow.png')] : []),
          ...(flags.evt_p3_entered ? [ITEM('+','tent_snow.png')] : [])

        track: 'deadwood',
        trackCond: () => flags.p3_02_deadwood,
        onEnd: () => SaveSys.save(() => enterScene('riding'))   // 区域末尾：存档外显
      }
    ]
  },

  mountain_region: {

    hotspots: [
      { id:'p3_03_stones', item:'item12_01.png', when:() => !flags.p3_03_stones,

    segments: [
      {   // 小物象：石堆（固定 · 惘）

          L('00','你勒马凑近，才发现那是十几块大圆石头。它们层层叠叠、规规整整，显然时哪个过客特意堆的，不知道是用来指引归途，还是为了纪念故人。'),
          L('00','"是处青山可埋骨，他年夜雨独伤神。"你默默想起这联诗，在心里对那堆石头作上一揖。'),
          L('00','风雪很快又会把这堆碎石重新掩埋，摆放者究竟是不是为了他人立的石头，你也无从可考了。'),
          TAG('wistful','stones'),
          INC('cnt_wistful')
        ],
        sets: ['p3_03_stones']
      },
      {   // 大物象：山 C（惘-茅屋/宁古塔幻象 / 哀-庭院/词稿）——进场环境动态分支

            L('00','走到这片峡谷口附近时，风雪明显紧了起来。你胸腔里跃动微醺暖融融的酒意被撬开一角，挨了冻，灰溜溜地叫你赶紧往回走两步。'),

            L('00','你猛地一惊，呛进一口冰凉的风雪，剧烈地咳嗽了几声。那股缠绵了你一路的沉沉琐思竟溜走了。'),
            L('00','抬手遮在额前，你眯起眼睛看向前方的谷口。眼前的风势越来越大，夹着碎雪打在脸上阵刺痛。'),
            L('00','再往前走怕是站不稳脚跟。你顺着来路退了几步，避到山脚下一处自然延伸出来的低矮岩壁后。这片凹进去的山脚挡掉了正面吹来的狂风，终于让你有了个能站稳脚跟的地方。')
